<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>cifail dashboard</title>
<style>
  :root {
    --bg: #0f1419; --panel: #1a2029; --border: #2a323d; --fg: #e6e9ee;
    --muted: #8b96a5; --accent: #4ea1ff; --green: #4caf7d; --amber: #d8a657; --red: #e06c75;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header h1 span { color: var(--accent); }
  .grow { flex: 1; }
  input, select, button {
    background: var(--bg); color: var(--fg); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 9px; font: inherit;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #04121f; border-color: var(--accent); font-weight: 600; }
  .layout { display: flex; gap: 0; height: calc(100vh - 58px); }
  .list { flex: 1; overflow: auto; }
  .detail {
    width: 42%; max-width: 560px; overflow: auto; padding: 16px;
    border-left: 1px solid var(--border); background: var(--panel);
  }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { position: sticky; top: 0; background: var(--panel); color: var(--muted); font-weight: 500; z-index: 1; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: #161c24; }
  tbody tr.sel { background: #1d2733; }
  td.wrap { white-space: normal; color: var(--muted); max-width: 360px; overflow: hidden; text-overflow: ellipsis; }
  .tag { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 12px; border: 1px solid var(--border); }
  .open { color: var(--amber); border-color: var(--amber); }
  .resolved { color: var(--green); border-color: var(--green); }
  .muted { color: var(--muted); }
  .banner { padding: 10px 16px; background: #2a1f1f; color: var(--red); border-bottom: 1px solid var(--border); display: none; }
  .empty { padding: 40px 16px; color: var(--muted); text-align: center; }
  pre { white-space: pre-wrap; word-break: break-word; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px; margin: 6px 0 14px; }
  .detail h2 { font-size: 15px; margin: 0 0 4px; }
  .kv { display: grid; grid-template-columns: 120px 1fr; gap: 4px 10px; margin: 10px 0 14px; }
  .kv div:nth-child(odd) { color: var(--muted); }
  code { color: var(--accent); }
  .ph { color: var(--muted); padding: 40px 16px; text-align: center; }
  .trends { display: flex; gap: 12px; flex-wrap: wrap; padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--border); }
  .trends:empty { display: none; }
  .card { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; min-width: 86px; }
  .card .n { font-size: 20px; font-weight: 600; }
  .card .n.warn { color: var(--amber); }
  .card .l { color: var(--muted); font-size: 12px; }
  .card.wide { flex: 1; min-width: 220px; }
  .card.wide ul { margin: 6px 0 0; padding: 0; list-style: none; }
  .card.wide li { display: flex; justify-content: space-between; gap: 10px; }
  .card.wide li + li { margin-top: 2px; }
  .card.wide li span { color: var(--muted); }
</style>
</head>
<body>
  <header>
    <h1><span>cifail</span> dashboard</h1>
    <select id="fEco" title="Filter by ecosystem"><option value="">all ecosystems</option></select>
    <select id="fStatus" title="Filter by status">
      <option value="">all statuses</option>
      <option value="open">open</option>
      <option value="resolved">resolved</option>
    </select>
    <input id="fRepo" placeholder="filter repo id…" size="14" title="Filter by repo id (substring)" />
    <span class="grow"></span>
    <input id="token" type="password" placeholder="access token (if required)" size="22" />
    <button id="saveTok">Save token</button>
    <button id="refresh" class="primary">Refresh</button>
  </header>
  <div id="banner" class="banner"></div>
  <div id="trends" class="trends"></div>
  <div class="layout">
    <div class="list">
      <table>
        <thead><tr><th>#</th><th>when</th><th>ecosystem</th><th>rule</th><th>status</th><th>source</th><th>excerpt</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div id="empty" class="empty" style="display:none">No failures match.</div>
    </div>
    <div class="detail" id="detail"><div class="ph">Select a failure to see details.</div></div>
  </div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const TOKEN_KEY = "cifail_token";

let all = [];      // last-fetched records
let selected = null;

function token() { return localStorage.getItem(TOKEN_KEY) || ""; }

async function api(path, opts = {}) {
  const headers = Object.assign({}, opts.headers);
  const t = token();
  if (t) headers["Authorization"] = "Bearer " + t;
  const res = await fetch(path, Object.assign({}, opts, { headers }));
  if (res.status === 401) throw new Error("401: this server requires an access token — enter one above and Save.");
  if (!res.ok) throw new Error(res.status + ": " + (await res.text().catch(() => res.statusText)));
  return res;
}

function banner(msg) {
  const b = $("banner");
  if (!msg) { b.style.display = "none"; return; }
  b.textContent = msg; b.style.display = "block";
}

function fmtWhen(iso) { try { return new Date(iso).toLocaleString(); } catch { return iso; } }
function statusTag(r) {
  if (r.Status === "resolved") {
    const auto = r.ResolutionSource === "auto";
    return `<span class="tag resolved">✓${auto ? " auto" : ""}</span>`;
  }
  return `<span class="tag open">open</span>`;
}

function filtered() {
  const eco = $("fEco").value, st = $("fStatus").value, repo = $("fRepo").value.trim().toLowerCase();
  return all.filter((r) =>
    (!eco || r.Ecosystem === eco) &&
    (!st || r.Status === st) &&
    (!repo || (r.RepoId || "").toLowerCase().includes(repo)));
}

function renderList() {
  const rows = filtered();
  $("empty").style.display = rows.length ? "none" : "block";
  $("rows").innerHTML = rows.map((r) => `
    <tr data-id="${r.Id}" class="${selected === r.Id ? "sel" : ""}">
      <td class="muted">${r.Id}</td>
      <td class="muted">${esc(fmtWhen(r.AnalyzedAt))}</td>
      <td>${esc(r.Ecosystem)}</td>
      <td><code>${esc(r.RuleId)}</code></td>
      <td>${statusTag(r)}</td>
      <td class="muted">${esc(r.Source)}</td>
      <td class="wrap">${esc(r.Excerpt)}</td>
    </tr>`).join("");
  for (const tr of $("rows").querySelectorAll("tr"))
    tr.onclick = () => showDetail(Number(tr.dataset.id));
}

function ecoOptions() {
  const cur = $("fEco").value;
  const ecos = [...new Set(all.map((r) => r.Ecosystem).filter(Boolean))].sort();
  $("fEco").innerHTML = `<option value="">all ecosystems</option>` +
    ecos.map((e) => `<option ${e === cur ? "selected" : ""}>${esc(e)}</option>`).join("");
}

async function showDetail(id) {
  selected = id;
  renderList();
  try {
    const r = await (await api("history/" + id)).json();
    const resolveBtn = r.Status === "open"
      ? `<button class="primary" id="resolveBtn">Mark resolved…</button>`
      : "";
    $("detail").innerHTML = `
      <h2>#${r.Id} · <code>${esc(r.RuleId)}</code> ${statusTag(r)}</h2>
      <div class="muted">${esc(fmtWhen(r.AnalyzedAt))} · ${esc(r.Source)}</div>
      <div class="kv">
        <div>ecosystem</div><div>${esc(r.Ecosystem)}</div>
        <div>matched</div><div>${r.Matched ? "yes" : "no"}</div>
        <div>fingerprint</div><div><code>${esc(r.Fingerprint)}</code></div>
        ${r.GitCommit ? `<div>commit</div><div><code>${esc(r.GitCommit)}</code>${r.GitDirty ? " (dirty)" : ""}</div>` : ""}
        ${r.GitBranch ? `<div>branch</div><div>${esc(r.GitBranch)}</div>` : ""}
        ${r.RepoId ? `<div>repo</div><div><code>${esc(r.RepoId)}</code></div>` : ""}
        ${r.ResolutionSource ? `<div>resolved by</div><div>${esc(r.ResolutionSource)}${r.ResolvedCommit ? " · <code>" + esc(r.ResolvedCommit) + "</code>" : ""}</div>` : ""}
        ${r.ResolvedAt ? `<div>resolved at</div><div>${esc(fmtWhen(r.ResolvedAt))}</div>` : ""}
      </div>
      <div class="muted">excerpt</div>
      <pre>${esc(r.Excerpt)}</pre>
      ${r.Resolution ? `<div class="muted">resolution</div><pre>${esc(r.Resolution)}</pre>` : ""}
      ${resolveBtn}`;
    const rb = $("resolveBtn");
    if (rb) rb.onclick = () => resolve(r.Id);
  } catch (e) { banner(e.message); }
}

async function resolve(id) {
  const note = prompt("How was it fixed? (saved as the resolution note)");
  if (!note) return;
  try {
    await api("resolve/" + id, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ note }),
    });
    banner("");
    await load();
    showDetail(id);
  } catch (e) { banner(e.message); }
}

function fmtPct(x) { return Math.round((x || 0) * 100) + "%"; }
function fmtDur(secs) {
  if (secs == null) return "—";
  if (secs >= 86400) return (secs / 86400).toFixed(1) + "d";
  if (secs >= 3600) return (secs / 3600).toFixed(1) + "h";
  if (secs >= 60) return Math.round(secs / 60) + "m";
  return Math.round(secs) + "s";
}

async function loadStats() {
  // Trends are best-effort; hard auth/network errors are already surfaced by load().
  try {
    const s = await (await api("stats?top=5")).json();
    const card = (n, l, cls = "") => `<div class="card"><div class="n ${cls}">${esc(n)}</div><div class="l">${esc(l)}</div></div>`;
    const li = (f) => `<li><code>${esc(f.RuleId)}</code><span>${f.Count}×${f.Flaky ? " ⚠" : ""}</span></li>`;
    const top = (s.TopFailures || []).map(li).join("") || `<li class="muted">none</li>`;
    const flaky = (s.Flaky || []).map(li).join("") || `<li class="muted">none 🎉</li>`;

    // Failure clusters (R25) — best-effort; an older server without /clusters just omits the card.
    let clusterCard = "";
    try {
      const c = await (await api("clusters?top=5")).json();
      const cli = (cl) => `<li><code>${esc(cl.Label)}</code><span>${cl.Count}×</span></li>`;
      const items = (c.Clusters || []).map(cli).join("") || `<li class="muted">no recurring groups</li>`;
      clusterCard = `<div class="card wide"><div class="l">clusters (grouped root causes)</div><ul>${items}</ul></div>`;
    } catch { clusterCard = ""; }

    $("trends").innerHTML =
      card(s.Total, "failures") +
      card(s.Open, "open") +
      card(s.Resolved, "resolved") +
      card(s.Unmatched, "unmatched", s.Unmatched ? "warn" : "") +
      card(fmtPct(s.RecurrenceRate), "recurrence") +
      card(fmtDur(s.MeanTimeToResolutionSeconds), "mean resolve") +
      `<div class="card wide"><div class="l">top recurring</div><ul>${top}</ul></div>` +
      `<div class="card wide"><div class="l">flaky (resolved → recurred)</div><ul>${flaky}</ul></div>` +
      clusterCard;
  } catch { $("trends").innerHTML = ""; }
}

async function load() {
  try {
    banner("");
    all = await (await api("history?limit=200")).json();
    ecoOptions();
    renderList();
    loadStats();
  } catch (e) {
    banner(e.message);
    all = []; renderList();
    $("trends").innerHTML = "";
  }
}

$("saveTok").onclick = () => {
  const v = $("token").value.trim();
  if (v) localStorage.setItem(TOKEN_KEY, v); else localStorage.removeItem(TOKEN_KEY);
  $("token").value = "";
  load();
};
$("refresh").onclick = load;
for (const f of ["fEco", "fStatus", "fRepo"]) $(f).oninput = renderList;

load();
</script>
</body>
</html>
