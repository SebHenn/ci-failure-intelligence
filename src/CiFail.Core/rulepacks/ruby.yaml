# Ruby / Bundler / RSpec / Rake rule pack

- id: bundler-gem-not-found
  ecosystem: ruby
  category: dependency
  title: Bundler could not find a gem
  match: "Could not find gem '(?<gem>[^']+)'|An error occurred while installing (?<gem2>[\\w\\-]+) \\("
  confidence: 0.85
  fix: |
    Bundler couldn't resolve a gem. Check the name/version in the Gemfile, run
    `bundle install` locally, and confirm the source (rubygems.org or a private gem
    server) is declared and reachable from the runner.
  docs: https://bundler.io/man/bundle-install.1.html

- id: ruby-load-error
  ecosystem: ruby
  category: dependency
  title: Ruby LoadError (cannot load file)
  match: "(?:cannot load such file|LoadError) -- (?<file>[^\\s]+)"
  confidence: 0.8
  fix: |
    Ruby couldn't load '{file}'. If it's a gem, add it to the Gemfile and run it via
    `bundle exec` so the bundled gems are on the load path. If it's a local file,
    check the require path (relative vs absolute) and casing.
  docs: https://docs.ruby-lang.org/en/master/Kernel.html#method-i-require

- id: rspec-failure
  ecosystem: ruby
  category: test
  title: RSpec examples failed
  match: "(?<counts>\\d+ examples?, (?<failed>[1-9]\\d*) failures?)"
  confidence: 0.65
  fix: |
    RSpec reported failures ({counts}). Scroll up to the "Failures:" section for the
    expected vs got values and the offending spec file:line. Re-run just those with
    `bundle exec rspec ./spec/path_spec.rb:<line>`.
  docs: https://rspec.info/documentation/

- id: rake-aborted
  ecosystem: ruby
  category: build
  title: Rake task aborted
  match: "rake aborted!\\s*\\n?(?<message>[^\\n]+)?"
  confidence: 0.55
  fix: |
    A Rake task aborted. The underlying exception and the failing task are on the
    lines just below "rake aborted!". Re-run with `rake <task> --trace` to get the
    full backtrace.
  docs: https://ruby.github.io/rake/

- id: ruby-syntax-error
  ecosystem: ruby
  category: compile
  title: Ruby syntax error
  match: "(?<file>[^\\s:]+\\.rb):(?<line>\\d+): syntax error, (?<message>.+)"
  confidence: 0.85
  fix: |
    Ruby couldn't parse {file}:{line}: {message}
    Fix the syntax at that line — a missing `end`, unbalanced bracket, or stray comma
    are common. `ruby -c <file>` checks syntax without running the file.
  docs: https://docs.ruby-lang.org/en/master/syntax_rdoc.html

- id: ruby-nomethod-error
  ecosystem: ruby
  category: runtime
  title: NoMethodError / NameError
  # [\s\S] rather than . — Ruby prints the exception class and the description on separate
  # lines, and the engine compiles without Singleline, so `.` stopped at the newline and this
  # never matched real output. Bounded so it can't run away across an entire log.
  match: "(?:NoMethodError|NameError)\\b[\\s\\S]{0,200}?(?:undefined (?:method|local variable or method) [`'](?<name>[^'`]+)|uninitialized constant (?<constant>[\\w:]+))"
  confidence: 0.7
  fix: |
    Ruby called a method or referenced a name that doesn't exist on the receiver
    (often a nil, a typo, or a missing require/autoload). Read the backtrace for the
    file:line, and check the object is the type you expect at that point.
  docs: https://docs.ruby-lang.org/en/master/NoMethodError.html

- id: bundler-version-conflict
  ecosystem: ruby
  category: dependency
  title: Bundler version conflict
  match: "Bundler could not find compatible versions for gem [\"'](?<gem>[^\"']+)|Could not find compatible versions"
  confidence: 0.8
  fix: |
    Two gems require incompatible versions of a shared dependency. Read the conflict
    Bundler prints, then relax or align the version constraints in the Gemfile and run
    `bundle update <gem>`. Committing Gemfile.lock keeps CI and local in sync.
  docs: https://bundler.io/man/bundle-update.1.html
