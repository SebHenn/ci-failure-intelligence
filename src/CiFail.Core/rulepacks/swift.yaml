# Swift / Xcode (iOS/macOS) rule pack

- id: swift-no-such-module
  ecosystem: swift
  category: dependency
  title: Swift module not found
  match: "(?:error: )?no such module '(?<module>[^']+)'"
  confidence: 0.85
  fix: |
    Swift couldn't import module '{module}'. If it's a package, resolve dependencies
    (`swift package resolve` or File > Packages > Resolve in Xcode) and confirm it's a
    dependency of this target. For CocoaPods/Carthage, open the .xcworkspace (not the
    .xcodeproj) and check the framework search paths.
  docs: https://developer.apple.com/documentation/xcode/configuring-a-new-target-in-your-project

- id: swift-compile-error
  ecosystem: swift
  category: compile
  title: Swift compile error
  # The negative lookahead keeps this off XCTest failures, which Xcode also reports as
  # `File.swift:23: error: -[SuiteName testName] : XCTAssertEqual failed`. Without it both
  # rules fire on every failing test and "other things cifail noticed" is pure restatement.
  match: "(?<file>[^\\s:]+\\.swift):(?<line>\\d+):(?:\\d+:)? error: (?!-\\[)(?<message>.+)"
  confidence: 0.7
  fix: |
    The Swift compiler rejected {file}:{line}: {message}
    Fix the reported line and rebuild. A more specific rule (missing module, code
    signing) wins when it applies.
  docs: https://docs.swift.org/swift-book/documentation/the-swift-programming-language/

- id: xcode-code-signing
  ecosystem: swift
  category: signing
  title: Code signing / provisioning failed
  match: "(?:Code Sign(?:ing)? error|No (?:profile|certificate|signing certificate)|requires a provisioning profile|Provisioning profile .* (?:doesn't|does not) (?:match|include)|errSecInternalComponent)"
  confidence: 0.8
  fix: |
    The build failed to code-sign. Confirm the signing certificate and a matching
    provisioning profile are installed on the runner's keychain, the bundle id and
    team match the profile, and (in CI) that the keychain is unlocked. Automatic
    signing often needs manual profiles for CI.
  docs: https://developer.apple.com/documentation/xcode/signing-your-app

- id: xcode-build-failed
  ecosystem: swift
  category: build
  title: Xcode build failed
  match: "\\*\\* (?:BUILD|TEST|ARCHIVE) FAILED \\*\\*"
  confidence: 0.55
  fix: |
    xcodebuild reported failure. The real cause is the first `error:` line above this
    summary (compile, linker, or signing). Reproduce with the same `xcodebuild`
    invocation locally and add `-quiet` to cut noise, or open the project in Xcode.
  docs: https://developer.apple.com/documentation/xcode/building-and-running-an-app

- id: swift-linker-symbols
  ecosystem: swift
  category: link
  title: Undefined symbols (linker)
  match: "Undefined symbols for architecture (?<arch>[\\w]+):|ld: symbol\\(s\\) not found for architecture"
  confidence: 0.75
  fix: |
    The linker couldn't resolve symbols. Usually a framework/library isn't linked or a
    target membership is missing: add the framework under "Link Binary With
    Libraries", check the source file belongs to the target, and that any C/ObjC
    bridging is set up.
  docs: https://developer.apple.com/documentation/xcode/linking-and-loading-symbols

- id: xctest-failed
  ecosystem: swift
  category: test
  title: XCTest test failed
  match: "XCTAssert\\w* failed(?::| -)|Test Case '-\\[(?<suite>[\\w.]+) (?<test>[\\w]+)\\]' failed"
  confidence: 0.8
  fix: |
    An XCTest assertion failed. The line above names the test case, and shows the file and
    the values it compared. Re-run just that test with
    `xcodebuild test -only-testing:<Target>/<Suite>/<testMethod>` (or
    `swift test --filter <testMethod>` for a SwiftPM package).
  docs: https://developer.apple.com/documentation/xctest

- id: swift-package-resolution
  ecosystem: swift
  category: dependency
  title: Swift package dependencies could not be resolved
  match: "error: [Dd]ependencies could not be resolved|the package at '(?<path>[^']+)' cannot be accessed|error: Couldn't get revision"
  confidence: 0.85
  fix: |
    SwiftPM could not build a dependency graph. Either two packages demand incompatible
    version ranges of a shared dependency — the line below names it — or a repository
    isn't reachable (a private repo needs the runner's SSH key or token). Reproduce with
    `swift package resolve`, and `swift package show-dependencies` prints the graph.
  docs: https://developer.apple.com/documentation/packagedescription

- id: swift-missing-product
  ecosystem: swift
  category: dependency
  title: Package product not found
  match: "error: product '(?<product>[^']+)' required by package '(?<package>[^']+)' target '(?<target>[^']+)' not found"
  confidence: 0.9
  fix: |
    Target '{target}' depends on a product named '{product}', which package '{package}'
    doesn't publish under that name. Product names are not package names — check the
    `products:` list in the dependency's Package.swift and use the exact string from there.
  docs: https://developer.apple.com/documentation/packagedescription/target/dependency

- id: xcodebuild-no-destination
  ecosystem: swift
  category: environment
  title: No matching build destination (simulator/device)
  match: "Unable to find a destination matching the provided destination specifier"
  confidence: 0.9
  fix: |
    The simulator or device you asked for doesn't exist on this runner — usually an OS or
    device name that a newer/older Xcode image no longer ships. `xcrun simctl list devices
    available` shows what is actually there. In CI, prefer a loose specifier like
    `-destination 'platform=iOS Simulator,name=iPhone 15'` (no OS pin), or
    `generic/platform=iOS` when you only need to build.
  docs: https://developer.apple.com/documentation/xcode/building-and-running-an-app

- id: cocoapods-sandbox-out-of-sync
  ecosystem: swift
  category: dependency
  title: Pods are out of sync with Podfile.lock
  match: "The sandbox is not in sync with the Podfile\\.lock"
  confidence: 0.9
  fix: |
    The checked-in Pods/ directory doesn't match Podfile.lock, so someone changed the
    Podfile without committing the result of `pod install`. Run `pod install` and commit
    both Podfile.lock and the Pods/Manifest.lock it updates.
  docs: https://guides.cocoapods.org/using/pod-install-vs-update.html
