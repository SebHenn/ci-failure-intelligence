# Go / go build / go test rule pack

- id: go-undefined
  ecosystem: go
  category: compile
  title: Go undefined symbol
  match: "(?<file>[^\\s:]+\\.go):(?<line>\\d+):\\d+: undefined: (?<symbol>[\\w.]+)"
  confidence: 0.8
  fix: |
    {file}:{line} references '{symbol}', which the compiler can't find. Check for a
    typo, a missing import, or an unexported name from another package. Run
    `go build ./...` locally to reproduce.
  docs: https://go.dev/ref/spec#Declarations_and_scope

- id: go-cannot-find-package
  ecosystem: go
  category: dependency
  title: Go cannot find package
  match: "cannot find package \"(?<package>[^\"]+)\"|no required module provides package (?<package2>[^\\s;]+)"
  confidence: 0.85
  fix: |
    Go could not resolve a required package. Run `go mod tidy` to add the missing
    requirement, confirm the import path is spelled correctly, and that the module
    is reachable (GOPROXY / private-module auth).
  docs: https://go.dev/ref/mod

- id: go-mod-mismatch
  ecosystem: go
  category: dependency
  title: go.mod / go.sum out of sync
  match: "(?:missing go\\.sum entry|updates to go\\.mod needed|inconsistent vendoring|go\\.sum is out of date)"
  confidence: 0.85
  fix: |
    go.mod/go.sum are out of sync with the source. Run `go mod tidy` (and commit the
    result), or `go mod download` to populate go.sum. In CI, build with
    `-mod=mod` only if you intend modules to be updated.
  docs: https://go.dev/ref/mod#go-mod-tidy

- id: go-build-failed
  ecosystem: go
  category: build
  title: Go build failed
  # The negative lookahead keeps this off the errors the specific Go rules already explain
  # (undefined symbol, type mismatch, unresolved package). Without it this matched every Go
  # compile error, so both rules fired on every such log and the "other things cifail noticed"
  # list was pure restatement. Extend the lookahead when you add another go compile rule.
  match: "(?<file>[^\\s:]+\\.go):(?<line>\\d+):\\d+: (?!undefined: |cannot use |no required module provides )(?<message>.+)"
  confidence: 0.55
  fix: |
    Go failed to compile {file}:{line}: {message}
    Fix the reported line and re-run `go build ./...`. This is a generic compile
    error; a more specific rule (e.g. undefined symbol) wins when it applies.
  docs: https://pkg.go.dev/cmd/go#hdr-Compile_packages_and_dependencies

- id: go-test-failed
  ecosystem: go
  category: test
  title: Go test failed
  match: "--- FAIL: (?<test>[\\w/]+)|^FAIL\\s+(?<package>[\\w./\\-]+)"
  confidence: 0.65
  fix: |
    A Go test failed. Scroll up to the FAIL block for the assertion and the
    t.Errorf/t.Fatalf message. Reproduce a single test with
    `go test -run '^<TestName>$' ./...`.
  docs: https://pkg.go.dev/testing

- id: go-type-mismatch
  ecosystem: go
  category: compile
  title: Go type mismatch
  match: "(?<file>[^\\s:]+\\.go):(?<line>\\d+):\\d+: cannot use .+ as (?<type>[\\w.\\[\\]*]+) (?:value|type)"
  confidence: 0.78
  fix: |
    A value's type doesn't match what {file}:{line} expects ({type}). Convert it
    explicitly, fix the variable's declared type, or check you're passing the right
    argument. `go build ./...` shows the full context.
  docs: https://go.dev/ref/spec#Conversions

- id: go-import-cycle
  ecosystem: go
  category: build
  title: Go import cycle
  match: "import cycle not allowed"
  confidence: 0.85
  fix: |
    Two Go packages import each other (directly or transitively), which Go forbids.
    Break the cycle by moving the shared types/interfaces into a third package both can
    depend on, or by inverting one dependency. The lines below list the cycle.
  docs: https://go.dev/ref/spec#Import_declarations

- id: go-version-mismatch
  ecosystem: go
  category: environment
  title: Go toolchain version too old
  match: "note: module requires Go (?<version>[\\d.]+)|go: go\\.mod requires go >= (?<version2>[\\d.]+)"
  # Below the specific compile rules (0.78-0.85) on purpose. Go prints "note: module requires
  # Go 1.21" as a hint alongside ordinary compile errors, so on its own it is corroboration,
  # not the cause. It still wins when the toolchain really is too old, because then nothing
  # else matches. At the previous 0.8 it tied with go-undefined and the winner was arbitrary.
  confidence: 0.7
  fix: |
    The module needs a newer Go than the runner has. Bump the Go version in CI (e.g.
    actions/setup-go's `go-version`) to satisfy the `go` directive in go.mod, or lower
    that directive if you must support the older toolchain.
  docs: https://go.dev/doc/toolchain
