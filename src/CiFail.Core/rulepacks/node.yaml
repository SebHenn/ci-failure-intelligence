# Node / npm / yarn / pnpm rule pack

- id: npm-missing-module
  ecosystem: node
  category: dependency
  title: Module not found
  match: "Cannot find module '(?<module>[^']+)'"
  confidence: 0.85
  fix: |
    Node couldn't resolve module '{module}'. If it's a dependency, install it
    (npm install {module}) and confirm it's in package.json. If it's a local file,
    check the import path and casing (case-sensitive on Linux/CI).

- id: npm-eresolve
  ecosystem: node
  category: dependency
  title: npm dependency resolution conflict (ERESOLVE)
  match: "npm ERR! code ERESOLVE|npm ERR! ERESOLVE (?:unable to resolve|could not resolve)"
  confidence: 0.85
  fix: |
    npm hit a peer-dependency conflict it couldn't resolve. Inspect the
    "Conflicting peer dependency" lines above. Align the offending versions, or as
    a stopgap retry with `npm install --legacy-peer-deps` (understand the tradeoff).
  docs: https://docs.npmjs.com/cli/v10/using-npm/config#legacy-peer-deps

- id: npm-404
  ecosystem: node
  category: dependency
  title: npm package not found (404)
  match: "npm ERR! 404 .*?'(?<package>[^']+)' is not in (?:this registry|the npm registry)|npm ERR! 404 Not Found - GET .*/(?<package2>[^/\\s]+)"
  confidence: 0.85
  fix: |
    The registry returned 404 for a package. Check the name/scope for typos and
    whether it requires a private/scoped registry (.npmrc). Public packages must
    exist on the configured registry.

- id: npm-missing-script
  ecosystem: node
  category: build
  title: npm script not found
  match: "npm ERR! Missing script: \"(?<script>[^\"]+)\""
  confidence: 0.9
  fix: |
    package.json has no "{script}" script. Check the "scripts" section for the
    correct name (e.g. build vs compile), or add the missing script.

- id: node-enoent
  ecosystem: node
  category: environment
  title: File or command not found (ENOENT)
  match: "Error: ENOENT: no such file or directory, (?:open|scandir|stat) '(?<path>[^']+)'"
  confidence: 0.7
  fix: |
    A file/path expected at '{path}' doesn't exist in the CI environment. Confirm
    it's committed (not gitignored), generated by an earlier step, or that the
    working directory is what you expect.

- id: jest-test-failed
  ecosystem: node
  category: test
  title: Jest test failure
  match: "(?<counts>Tests:\\s+\\d+ failed)"
  confidence: 0.65
  fix: |
    One or more Jest tests failed ({counts}). Scroll up to the first ✕/● failure to
    see the expected vs received values, then run it in isolation with
    `npx jest -t "<test name>"`.
