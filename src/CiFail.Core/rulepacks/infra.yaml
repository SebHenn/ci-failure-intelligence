# Infrastructure: Docker build + Terraform/OpenTofu rule pack.
# Generic docker/registry rules also exist in generic.yaml; these are more specific
# and ecosystem-scoped so they win when an infra log is detected.

- id: terraform-state-lock
  ecosystem: infra
  category: state
  title: Terraform could not acquire the state lock
  match: "Error acquiring the state lock"
  confidence: 0.85
  fix: |
    Terraform couldn't lock the state — usually another apply is running or a previous
    run crashed and left the lock. Wait for the other run, or if you're sure it's
    stale, release it with `terraform force-unlock <LOCK_ID>` (the ID is printed
    above). Don't force-unlock while a real apply is in progress.
  docs: https://developer.hashicorp.com/terraform/language/state/locking

- id: terraform-provider-unavailable
  ecosystem: infra
  category: dependency
  title: Terraform provider could not be installed
  match: "Failed to (?:query available provider packages|install provider)|Could not retrieve the list of available versions for provider (?<provider>[\\w./-]+)"
  confidence: 0.8
  fix: |
    Terraform init couldn't fetch a provider. Check the source address and version
    constraint in required_providers, that the registry is reachable from the runner
    (proxy/network), and run `terraform init -upgrade`. Commit `.terraform.lock.hcl`
    so CI resolves the same versions you do.
  docs: https://developer.hashicorp.com/terraform/language/providers/requirements

- id: terraform-error
  ecosystem: infra
  category: build
  title: Terraform reported an error
  match: "(?:^|\\s)│\\s*Error: (?<message>.+)"
  confidence: 0.6
  fix: |
    Terraform failed: {message}
    Read the framed error block for the resource and file:line it points to. Run
    `terraform validate` and `terraform plan` locally to reproduce; a more specific
    rule (state lock, provider) wins when it applies.
  docs: https://developer.hashicorp.com/terraform/cli/commands/plan

- id: docker-copy-not-found
  ecosystem: infra
  category: build
  title: Docker COPY/ADD source not found
  match: "(?:COPY|ADD) failed: (?:file not found in build context|stat )(?<path>[^\\n:]+)?|failed to compute cache key: .*?\"(?<path>[^\"]+)\": not found"
  confidence: 0.8
  fix: |
    A Docker COPY/ADD referenced a path that isn't in the build context. Check the
    source path is relative to the build context (the directory you pass to
    `docker build`), that it isn't excluded by .dockerignore, and that an earlier
    build stage actually produced it.
  docs: https://docs.docker.com/reference/dockerfile/#copy

- id: dockerfile-parse-error
  ecosystem: infra
  category: build
  title: Dockerfile parse error
  match: "dockerfile parse error.*?: (?<message>.+)|Unknown instruction: (?<instruction>[\\w-]+)"
  confidence: 0.8
  fix: |
    BuildKit couldn't parse the Dockerfile. Check the reported line for a typo in an
    instruction, a missing line continuation (`\\`), or a heredoc/quote that isn't
    closed. Lint it with `docker build --check` or hadolint.
  docs: https://docs.docker.com/reference/dockerfile/

- id: terraform-unsupported-argument
  ecosystem: infra
  category: config
  title: Terraform unsupported or missing argument
  match: "Error: (?:Unsupported argument|Missing required argument|Unsupported block type)"
  confidence: 0.7
  fix: |
    The configuration doesn't match the provider/resource schema — an argument was
    renamed, removed, or is required. Check the provider docs for the resource and the
    provider version you pinned; `terraform validate` reports the exact file and line.
  docs: https://developer.hashicorp.com/terraform/language

- id: k8s-image-pull-failed
  ecosystem: infra
  category: deploy
  title: Kubernetes cannot pull the container image
  match: "\\b(?<reason>ImagePullBackOff|ErrImagePull|ErrImageNeverPull)\\b|Failed to pull image \"(?<image>[^\"]+)\""
  confidence: 0.88
  fix: |
    The kubelet could not fetch the image named above. Three things to check, in order: the tag really
    exists in the registry (a deploy racing the image push is the classic one), the node
    can reach the registry, and — for a private registry — the ServiceAccount has an
    `imagePullSecrets` entry. `kubectl describe pod <pod>` prints the underlying registry
    error, which is more specific than this status.
  docs: https://kubernetes.io/docs/concepts/containers/images/

- id: k8s-crashloop
  ecosystem: infra
  category: deploy
  title: Pod is crash-looping
  match: "\\bCrashLoopBackOff\\b|Back-off restarting failed container"
  confidence: 0.85
  fix: |
    The container starts and then exits, repeatedly. The status is a symptom — the cause is
    in the container's own output: `kubectl logs <pod> --previous` shows the run that
    crashed (without `--previous` you get the one that hasn't failed yet). Most often a
    missing environment variable or config, a failing dependency at startup, or a command
    that runs to completion when Kubernetes expects a long-running process.
  docs: https://kubernetes.io/docs/tasks/debug/debug-application/debug-pods/

- id: k8s-rollout-timeout
  ecosystem: infra
  category: deploy
  title: Deployment rollout did not complete
  match: "error: timed out waiting for the condition|Waiting for (?:deployment|rollout) \"(?<name>[^\"]+)\" rollout to finish|deployment \"[^\"]+\" exceeded its progress deadline"
  confidence: 0.8
  fix: |
    `kubectl rollout status` gave up waiting. The new pods never became Ready — check them
    with `kubectl get pods` and `kubectl describe`. Common causes: a failing readiness
    probe, unschedulable pods (no node with enough CPU/memory, or a taint), or an image
    that won't pull. `kubectl rollout undo deployment/<name>` reverts while you look.
  docs: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/

- id: helm-release-failed
  ecosystem: infra
  category: deploy
  title: Helm install or upgrade failed
  match: "Error: (?:UPGRADE|INSTALL) FAILED: (?<message>.+)|Error: release (?<release>\\S+) failed|has no deployed releases"
  confidence: 0.85
  fix: |
    The release did not go out; the line above carries Helm's own message.
    "has no deployed releases" means a previous install failed and left the release in a
    broken state — `helm uninstall <release>` and reinstall, or `helm rollback`. If the
    error mentions a field being immutable, the resource has to be deleted rather than
    patched. `helm upgrade --atomic` rolls back automatically instead of leaving this mess.
  docs: https://helm.sh/docs/helm/helm_upgrade/

- id: helm-template-error
  ecosystem: infra
  category: build
  title: Helm chart template failed to render
  match: "Error: (?:template|parse error|YAML parse error|failed to parse)[^\\n]*: (?<message>.+)|executing \"(?<template>[^\"]+)\" at <(?<expression>[^>]+)>"
  confidence: 0.85
  fix: |
    The chart didn't render, so nothing was sent to the cluster. The template and the
    expression named above are where it broke — usually a value that isn't set (guard it
    with `default` or `required`), or indentation that produced invalid YAML. Reproduce
    without a cluster: `helm template . -f values.yaml`, and `--debug` prints the rendered
    output.
  docs: https://helm.sh/docs/chart_template_guide/debugging/
