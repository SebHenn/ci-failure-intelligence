# Generic / cross-ecosystem CI rule pack.
# These are ecosystem-agnostic and always evaluated. Confidence is deliberately
# lower so an ecosystem-specific rule wins when both match.

- id: generic-command-not-found
  ecosystem: generic
  category: environment
  title: Command not found
  # Three shell wordings, and they disagree on word order:
  #   bash: "./x.sh: line 12: shellcheck: command not found"
  #   dash: "sh: 1: jq: not found"          <- needs the sh prefix, or it matches any
  #                                            "...: not found" (e.g. BuildKit cache-key errors)
  #   zsh:  "zsh: command not found: jq"
  # The rule previously had only the reversed form plus the bash one, so dash output — what
  # `sh -c` in a container actually prints — went unrecognized.
  match: "(?<command>[\\w.+/-]+): command not found|^\\S*sh: \\d+: (?<command>[^:\\s]+): not found$|command not found: (?<command>\\S+)"
  confidence: 0.7
  fix: |
    '{command}' isn't installed or isn't on PATH in the CI environment.
    Install it in a setup step, or call it by its full path. Check it's actually
    present on the runner image you're using — a tool you have locally is not
    automatically there.
  docs: https://docs.github.com/actions/using-github-hosted-runners/about-github-hosted-runners

- id: github-actions-error
  ecosystem: generic
  category: ci
  title: GitHub Actions step error
  # Two spellings of the same annotation, and which one you get depends on where the log
  # came from: `::error::msg` is what a script *writes*, `##[error]msg` is how the runner
  # *renders* it in the log you download from the Actions UI. A workflow that tees its own
  # output — which is how cifail's README and action.yml say to capture a log — keeps the
  # `::` form, so matching only `##[error]` missed the highest-signal line in exactly the
  # logs cifail tells you to produce.
  # The optional middle part is the annotation's properties (`::error file=a.cs,line=12::`),
  # which carry no colon of their own, so `[^:]*` stops at the closing `::`.
  match: "(?:##\\[error\\]|::error(?:\\s[^:]*)?::)(?<message>.+)"
  confidence: 0.5
  fix: |
    A GitHub Actions step reported an error: {message}
    This is the surfaced failure; the underlying cause is usually in the command
    output just above. Re-run with debug logging (ACTIONS_STEP_DEBUG=true) for more.
  docs: https://docs.github.com/actions/monitoring-and-troubleshooting-workflows/enabling-debug-logging

- id: generic-permission-denied
  ecosystem: generic
  category: environment
  title: Permission denied
  match: "(?<what>[^\\n:]+): Permission denied|EACCES: permission denied"
  confidence: 0.6
  fix: |
    The process was denied access. Common causes on CI: a script without the
    executable bit (chmod +x), writing outside the workspace, or a port/file owned
    by another user. Check file permissions and target paths.
  docs: https://docs.github.com/actions/writing-workflows/choosing-what-your-workflow-does/adding-scripts-to-your-workflow

- id: generic-oom
  ecosystem: generic
  category: environment
  title: Out of memory / process killed
  match: "(?:Killed|OOMKilled|JavaScript heap out of memory|Out of memory|signal SIGKILL|exit code 137)"
  confidence: 0.7
  fix: |
    A process was killed, most likely for exceeding available memory (exit 137 /
    OOMKilled). Reduce memory use, raise the runner/container memory limit, or for
    Node bump --max-old-space-size.
  docs: https://docs.github.com/actions/using-github-hosted-runners/about-github-hosted-runners#supported-runners-and-hardware-resources

- id: generic-nonzero-exit
  ecosystem: generic
  category: build
  title: Process exited with a non-zero code
  match: "(?:exited with (?:code|status)|returned (?:exit )?code|Process completed with exit code) (?<code>[1-9]\\d*)"
  confidence: 0.4
  fix: |
    A step exited with code {code}. This is a generic failure signal — the real
    cause is in that command's own output above. Re-run that command locally to
    reproduce and capture the specific error.
  docs: https://docs.github.com/actions/writing-workflows/choosing-what-your-workflow-does/workflow-commands-for-github-actions#setting-an-error-message

- id: generic-timeout
  ecosystem: generic
  category: ci
  title: Step or job timed out
  # "The operation was canceled." follows any cancellation, so a run cancelled for a newer push or
  # a runner that went away is left to the rules below, which say "re-run" rather than "raise
  # timeout-minutes" - and are not counted as timeouts by gate and stats (#63).
  match: "(?:The (?:job|operation|step) (?:running|was) .*?canceled|timed out after|timeout after|The job running on runner .* has exceeded the maximum execution time|ETIMEDOUT|context deadline exceeded)"
  notMatch: "Cancel{1,2}ing since a higher priority|The runner has received a shutdown signal|lost communication with the server"
  confidence: 0.6
  fix: |
    A step or job was cancelled for exceeding its time limit. Find the slow step
    (often a hung test, a network wait, or an infinite retry) and add a tighter
    per-command timeout, or raise the job's timeout-minutes if the work is genuinely
    that long. A hang usually points at a missing input or a deadlock.
  docs: https://docs.github.com/actions/writing-workflows/workflow-syntax-for-github-actions#jobsjob_idtimeout-minutes

- id: generic-disk-space
  ecosystem: generic
  category: environment
  title: No space left on device
  match: "(?:No space left on device|ENOSPC|write error: No space|disk quota exceeded)"
  confidence: 0.8
  fix: |
    The runner ran out of disk. Free space before the heavy step (prune Docker
    images/layers, delete caches/artifacts you don't need, clean build output), or
    use a larger runner. Hosted runners are small — large Docker builds and node_modules
    are the usual culprits.
  docs: https://docs.github.com/actions/using-github-hosted-runners/about-github-hosted-runners#supported-runners-and-hardware-resources

- id: generic-network-dns
  ecosystem: generic
  category: network
  title: Network / DNS failure
  match: "(?:Temporary failure in name resolution|Could not resolve host|getaddrinfo (?:ENOTFOUND|EAI_AGAIN)|Connection refused|Connection timed out|Network is unreachable|ECONNREFUSED|ECONNRESET)"
  confidence: 0.6
  fix: |
    A network connection failed (DNS or connectivity). Often transient — retry the
    step. If it persists, check the host/URL is correct and reachable from the
    runner, that no firewall/proxy is blocking it, and that any required VPN or
    service container is up before this step runs.
  docs: https://docs.github.com/actions/using-github-hosted-runners/about-github-hosted-runners/about-github-hosted-runners#cloud-hosts-used-by-github-hosted-runners

- id: generic-tls-cert
  ecosystem: generic
  category: network
  title: TLS / certificate verification failed
  match: "(?:certificate verify failed|SSL certificate problem|unable to get local issuer certificate|x509: certificate signed by unknown authority|CERTIFICATE_VERIFY_FAILED|self.signed certificate)"
  confidence: 0.7
  fix: |
    A TLS handshake failed because the certificate couldn't be verified. Install the
    CA chain on the runner (corporate/private mirrors often need a custom root CA),
    fix an expired/misconfigured server cert, or check the clock is correct. Disabling
    verification is a last resort and a security risk.
  docs: https://curl.se/docs/sslcerts.html

- id: generic-rate-limit
  ecosystem: generic
  category: network
  title: Rate limited (HTTP 429)
  match: "(?:HTTP(?:/\\d(?:\\.\\d)?)? 429|429 Too Many Requests|rate limit exceeded|You have exceeded a secondary rate limit|API rate limit exceeded)"
  confidence: 0.7
  fix: |
    A service rejected requests for rate limiting (429). Authenticate so you get a
    higher quota (e.g. a token for registry/API pulls), add caching to cut request
    volume, or back off and retry. Docker Hub's pull limit has a rule of its own.
  docs: https://docs.docker.com/docker-hub/usage/

- id: generic-docker-build
  ecosystem: generic
  category: build
  title: Docker build failed
  # Deliberately does NOT cover COPY/ADD failures, cache-key misses or Dockerfile parse errors:
  # infra.yaml's docker-copy-not-found and dockerfile-parse-error explain those properly, and
  # this rule used to restate them verbatim on every Docker log. BuildKit always prints
  # "failed to solve" for those anyway, so nothing stops being recognized.
  match: "(?:failed to solve|manifest unknown|returned a non-zero code)"
  confidence: 0.6
  fix: |
    A Docker image build failed. Read the failing build step (BuildKit prints the
    Dockerfile line). Common causes: a COPY/ADD source path that doesn't exist in the
    build context, a base image tag that's gone (manifest unknown), or a RUN command
    that exited non-zero. Reproduce with `docker build .` locally.
  docs: https://docs.docker.com/build/building/best-practices/

- id: generic-registry-auth
  ecosystem: generic
  category: auth
  title: Registry authentication / authorization failed
  match: "(?:denied: requested access to the resource is denied|unauthorized: authentication required|401 Unauthorized|403 Forbidden|pull access denied|no basic auth credentials|authentication required)"
  confidence: 0.65
  fix: |
    Access to a registry/artifact was denied (401/403). Provide valid credentials in
    CI (a registry login step or a token secret), confirm the token has the right
    scope (read:packages / pull), and that the image/package name and visibility are
    correct. Expired or unset secrets are the usual cause.
  docs: https://docs.github.com/packages/working-with-a-github-packages-registry/working-with-the-container-registry#authenticating-to-the-container-registry

- id: generic-segfault
  ecosystem: generic
  category: runtime
  title: Segmentation fault / process crash
  match: "(?:Segmentation fault|SIGSEGV|signal: segmentation fault|core dumped|caught signal SIGABRT|signal SIGBUS)"
  confidence: 0.65
  fix: |
    A process crashed with a memory fault. This usually points at a native bug — a bad
    pointer in compiled code, a mismatched native dependency/ABI, or a stack overflow
    from deep recursion. Re-run with sanitizers/a debugger locally, or pin the native
    library version that last worked.
  docs: https://man7.org/linux/man-pages/man7/signal.7.html

- id: generic-git-auth
  ecosystem: generic
  category: auth
  title: Git authentication / clone failed
  match: "(?:fatal: (?:Authentication failed|could not read Username|repository '.*' not found)|Permission denied \\(publickey\\)|remote: (?:Invalid username or password|Repository not found)|could not read Password)"
  confidence: 0.7
  fix: |
    Git couldn't authenticate to a remote. For HTTPS, supply a valid token (a PAT/CI
    token with repo read scope) instead of a password; for SSH, add the deploy key to
    the runner and the repo. Check the remote URL and that the secret hasn't expired —
    private submodules need credentials too.
  docs: https://docs.github.com/authentication/keeping-your-account-and-data-secure/managing-your-personal-access-tokens

# ---- GitHub Actions and Docker infrastructure (#63) ------------------------------------------
# Each of these used to fall through to a generic rule with the wrong advice: a pull limit read as
# an unrecognised Docker failure, a missing permissions: scope as "look at the output above", and a
# runner that went away as a timeout to raise. They outrank the generic rules they overlap with.

- id: docker-hub-pull-limit
  ecosystem: generic
  category: network
  title: Docker Hub pull rate limit reached
  # Docker Hub's own wording, which generic-rate-limit's "rate limit exceeded" never matched.
  match: "toomanyrequests: You have reached your (?:unauthenticated )?pull rate limit|You have reached your (?:unauthenticated )?pull rate limit"
  confidence: 0.85
  fix: |
    Docker Hub refused the pull: anonymous pulls are limited per IP, and hosted runners
    share IPs. Log in before pulling (docker/login-action with a Docker Hub token) for a
    per-account limit, pull from a mirror such as public.ecr.aws/docker/library or
    mirror.gcr.io, or push the image to GHCR and pull it from there.
  docs: https://docs.docker.com/docker-hub/usage/

- id: docker-platform-mismatch
  ecosystem: generic
  category: environment
  title: Image built for another CPU architecture
  match: "no matching manifest for (?<platform>[\\w/.-]+) in the manifest list entries|exec (?:/\\S+: )?format error|The requested image's platform \\((?<image>[^)]+)\\) does not match the detected host platform \\((?<platform>[^)]+)\\)"
  confidence: 0.8
  fix: |
    The image or binary is for a different CPU architecture than the runner. This is
    common since arm64 runners: an amd64-only image on ubuntu-24.04-arm, or an arm64
    image built on a Mac and run on amd64. Use a multi-arch image (docker buildx build
    --platform linux/amd64,linux/arm64), pin --platform to one the image has, or run the
    job on a runner of the image's architecture.
  docs: https://docs.docker.com/build/building/multi-platform/

- id: gha-token-permissions
  ecosystem: generic
  category: auth
  title: GITHUB_TOKEN lacks a permission
  match: "Resource not accessible by integration"
  confidence: 0.85
  fix: |
    The workflow's GITHUB_TOKEN does not have the scope this call needs. Add it under
    `permissions:` on the job or workflow, for example `pull-requests: write` to comment,
    `contents: write` to push or release, `packages: write` for GHCR, or `checks: write`.
    Setting `permissions:` at all drops every scope not listed. A pull request from a
    fork always gets a read-only token, whatever the workflow asks for.
  docs: https://docs.github.com/actions/writing-workflows/choosing-what-your-workflow-does/controlling-permissions-for-github_token

- id: gha-artifact-name-conflict
  ecosystem: generic
  category: ci
  title: Artifact name already used in this run
  match: "an artifact with this name already exists on the workflow run"
  confidence: 0.85
  fix: |
    upload-artifact v4 and later make artifacts immutable, so two uploads with one
    name in a run conflict - usually matrix jobs sharing a name. Put the matrix values in
    the name, set `overwrite: true` to replace the earlier one, or merge them later
    with actions/upload-artifact/merge.
  docs: https://github.com/actions/upload-artifact#not-uploading-to-the-same-artifact

- id: gha-deprecated-action
  ecosystem: generic
  category: ci
  title: Workflow uses a retired action version
  match: "uses a deprecated version of `?(?<action>[\\w.-]+/[\\w./-]+)`?(?::\\s*`?(?<version>v[\\d.]+)`?)?"
  confidence: 0.85
  fix: |
    GitHub fails every job that uses this version of '{action}'. Move to its current
    major version (for actions/upload-artifact and actions/download-artifact, v4 or
    later; read the action's migration notes, since v4 changed artifact behaviour).
    Dependabot's github-actions ecosystem keeps these current.
  docs: https://github.blog/changelog/2024-04-16-deprecation-notice-v3-of-the-artifact-actions/

- id: gha-action-not-found
  ecosystem: generic
  category: ci
  title: Action could not be resolved
  match: "Unable to resolve action `?(?<action>[^`',\\s]+)`?"
  confidence: 0.85
  fix: |
    The runner could not download '{action}': the tag, branch or SHA does not exist, the
    repository was renamed or deleted, or it is private and not shared with this one.
    Check the `uses:` line against the action's releases. For a private action, allow
    access under the action repository's Settings > Actions > Access.
  docs: https://docs.github.com/actions/writing-workflows/workflow-syntax-for-github-actions#jobsjob_idstepsuses

- id: gha-runner-lost
  ecosystem: generic
  category: ci
  title: Runner shut down or lost
  match: "The runner has received a shutdown signal|lost communication with the server"
  confidence: 0.85
  fix: |
    Not your code: the machine running the job went away - a preempted or recycled
    runner, a self-hosted runner that crashed or ran out of memory or disk, or a
    network drop. Re-run the job. If it keeps happening on a self-hosted runner, look at
    that machine's resources and the runner service's own log.
  docs: https://docs.github.com/actions/hosting-your-own-runners/managing-self-hosted-runners/monitoring-and-troubleshooting-self-hosted-runners

- id: gha-concurrency-cancelled
  ecosystem: generic
  category: ci
  title: Cancelled for a newer run in the concurrency group
  match: "Cancel{1,2}ing since a higher priority waiting request for '?(?<group>[^'\\n]+?)'? exists|Cancel{1,2}ing since a higher priority waiting request"
  confidence: 0.85
  fix: |
    Not a failure: a newer run in the concurrency group replaced this one, usually a
    newer push to the same branch with `cancel-in-progress: true`. The newer run's
    result is the one that counts. If runs are cancelled that should not be, give them
    different concurrency groups.
  docs: https://docs.github.com/actions/writing-workflows/choosing-what-your-workflow-does/control-the-concurrency-of-workflows-and-jobs
