# Generic / cross-ecosystem CI rule pack.
# These are ecosystem-agnostic and always evaluated. Confidence is deliberately
# lower so an ecosystem-specific rule wins when both match.

- id: generic-command-not-found
  ecosystem: generic
  category: environment
  title: Command not found
  match: "(?:command not found|: not found): (?<command>[^\\n]+)|(?<command2>[\\w./-]+): command not found"
  confidence: 0.7
  fix: |
    A required command isn't installed or isn't on PATH in the CI environment.
    Install it in a setup step, or use the full path. Verify the tool is available
    on the runner image you're using.

- id: github-actions-error
  ecosystem: generic
  category: ci
  title: GitHub Actions step error
  match: "##\\[error\\](?<message>.+)"
  confidence: 0.5
  fix: |
    A GitHub Actions step reported an error: {message}
    This is the surfaced failure; the underlying cause is usually in the command
    output just above. Re-run with debug logging (ACTIONS_STEP_DEBUG=true) for more.

- id: generic-permission-denied
  ecosystem: generic
  category: environment
  title: Permission denied
  match: "(?<what>[^\\n:]+): Permission denied|EACCES: permission denied"
  confidence: 0.6
  fix: |
    The process was denied access. Common causes on CI: a script without the
    executable bit (chmod +x), writing outside the workspace, or a port/file owned
    by another user. Check file permissions and target paths.

- id: generic-oom
  ecosystem: generic
  category: environment
  title: Out of memory / process killed
  match: "(?:Killed|OOMKilled|JavaScript heap out of memory|Out of memory|signal SIGKILL|exit code 137)"
  confidence: 0.7
  fix: |
    A process was killed, most likely for exceeding available memory (exit 137 /
    OOMKilled). Reduce memory use, raise the runner/container memory limit, or for
    Node bump --max-old-space-size.

- id: generic-nonzero-exit
  ecosystem: generic
  category: build
  title: Process exited with a non-zero code
  match: "(?:exited with (?:code|status)|returned (?:exit )?code|Process completed with exit code) (?<code>[1-9]\\d*)"
  confidence: 0.4
  fix: |
    A step exited with code {code}. This is a generic failure signal — the real
    cause is in that command's own output above. Re-run that command locally to
    reproduce and capture the specific error.

- id: generic-timeout
  ecosystem: generic
  category: ci
  title: Step or job timed out
  match: "(?:The (?:job|operation|step) (?:running|was) .*?canceled|timed out after|timeout after|Cancelling since a higher priority|The job running on runner .* has exceeded the maximum execution time|ETIMEDOUT|context deadline exceeded)"
  confidence: 0.6
  fix: |
    A step or job was cancelled for exceeding its time limit. Find the slow step
    (often a hung test, a network wait, or an infinite retry) and add a tighter
    per-command timeout, or raise the job's timeout-minutes if the work is genuinely
    that long. A hang usually points at a missing input or a deadlock.

- id: generic-disk-space
  ecosystem: generic
  category: environment
  title: No space left on device
  match: "(?:No space left on device|ENOSPC|write error: No space|disk quota exceeded)"
  confidence: 0.8
  fix: |
    The runner ran out of disk. Free space before the heavy step (prune Docker
    images/layers, delete caches/artifacts you don't need, clean build output), or
    use a larger runner. Hosted runners are small — large Docker builds and node_modules
    are the usual culprits.

- id: generic-network-dns
  ecosystem: generic
  category: network
  title: Network / DNS failure
  match: "(?:Temporary failure in name resolution|Could not resolve host|getaddrinfo (?:ENOTFOUND|EAI_AGAIN)|Connection refused|Connection timed out|Network is unreachable|ECONNREFUSED|ECONNRESET)"
  confidence: 0.6
  fix: |
    A network connection failed (DNS or connectivity). Often transient — retry the
    step. If it persists, check the host/URL is correct and reachable from the
    runner, that no firewall/proxy is blocking it, and that any required VPN or
    service container is up before this step runs.

- id: generic-tls-cert
  ecosystem: generic
  category: network
  title: TLS / certificate verification failed
  match: "(?:certificate verify failed|SSL certificate problem|unable to get local issuer certificate|x509: certificate signed by unknown authority|CERTIFICATE_VERIFY_FAILED|self.signed certificate)"
  confidence: 0.7
  fix: |
    A TLS handshake failed because the certificate couldn't be verified. Install the
    CA chain on the runner (corporate/private mirrors often need a custom root CA),
    fix an expired/misconfigured server cert, or check the clock is correct. Disabling
    verification is a last resort and a security risk.

- id: generic-rate-limit
  ecosystem: generic
  category: network
  title: Rate limited (HTTP 429)
  match: "(?:HTTP(?:/\\d(?:\\.\\d)?)? 429|429 Too Many Requests|rate limit exceeded|You have exceeded a secondary rate limit|API rate limit exceeded)"
  confidence: 0.7
  fix: |
    A service rejected requests for rate limiting (429). Authenticate so you get a
    higher quota (e.g. a token for registry/API pulls), add caching to cut request
    volume, or back off and retry. For Docker Hub pulls, log in or mirror the image.

- id: generic-docker-build
  ecosystem: generic
  category: build
  title: Docker build failed
  match: "(?:failed to solve|ERROR: failed to solve|COPY failed|ADD failed|manifest unknown|failed to compute cache key|dockerfile parse error|returned a non-zero code)"
  confidence: 0.6
  fix: |
    A Docker image build failed. Read the failing build step (BuildKit prints the
    Dockerfile line). Common causes: a COPY/ADD source path that doesn't exist in the
    build context, a base image tag that's gone (manifest unknown), or a RUN command
    that exited non-zero. Reproduce with `docker build .` locally.

- id: generic-registry-auth
  ecosystem: generic
  category: auth
  title: Registry authentication / authorization failed
  match: "(?:denied: requested access to the resource is denied|unauthorized: authentication required|401 Unauthorized|403 Forbidden|pull access denied|no basic auth credentials|authentication required)"
  confidence: 0.65
  fix: |
    Access to a registry/artifact was denied (401/403). Provide valid credentials in
    CI (a registry login step or a token secret), confirm the token has the right
    scope (read:packages / pull), and that the image/package name and visibility are
    correct. Expired or unset secrets are the usual cause.
