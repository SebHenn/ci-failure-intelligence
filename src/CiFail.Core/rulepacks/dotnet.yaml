# .NET / NuGet / MSBuild / xUnit rule pack
# Each rule: id, ecosystem, category, title, match (regex, named groups allowed),
# confidence (0..1), fix (template with {group} placeholders), docs (optional).

- id: nuget-nu1101
  ecosystem: dotnet
  category: dependency
  title: NuGet package not found
  match: "error NU1101: Unable to find package '?(?<package>[^'\\s.]+(?:\\.[^'\\s.]+)*)'?"
  confidence: 0.9
  fix: |
    Package '{package}' was not found in any configured NuGet source.
    Check the package name/version for typos, and confirm the right source is
    configured in nuget.config (e.g. nuget.org or a private feed).
  docs: https://learn.microsoft.com/nuget/reference/errors-and-warnings/nu1101

- id: nuget-nu1605
  ecosystem: dotnet
  category: dependency
  title: NuGet package downgrade detected
  match: "(?:error|warning) NU1605: .*?Detected package downgrade: (?<package>[^\\s]+)"
  confidence: 0.85
  fix: |
    A transitive dependency requires a higher version of '{package}' than the
    one referenced directly. Add a direct PackageReference to '{package}' at the
    higher version, or align the versions across projects.
  docs: https://learn.microsoft.com/nuget/reference/errors-and-warnings/nu1605

- id: nuget-nu1102
  ecosystem: dotnet
  category: dependency
  title: NuGet package version not found
  match: "error NU1102: Unable to find package (?<package>[^\\s]+) with version"
  confidence: 0.88
  fix: |
    The package '{package}' exists, but the requested version is not available in
    the configured sources. Pick an available version (check the feed) or update
    the version constraint in the .csproj / Directory.Packages.props.
  docs: https://learn.microsoft.com/nuget/reference/errors-and-warnings/nu1102

- id: msbuild-msb3073
  ecosystem: dotnet
  category: build
  title: MSBuild custom command exited with an error
  match: "error MSB3073: .*?exited with code (?<code>\\d+)"
  confidence: 0.7
  fix: |
    A custom build step (Exec task / pre- or post-build event) failed with exit
    code {code}. Look just above this line for the failing command's own output;
    run that command locally to reproduce.
  docs: https://learn.microsoft.com/visualstudio/msbuild/errors/msb3073

- id: csc-compile-error
  ecosystem: dotnet
  category: compile
  title: C# compile error
  match: "error (?<code>CS\\d{3,5}): (?<message>.+)"
  confidence: 0.6
  fix: |
    Compilation failed ({code}): {message}
    Fix the offending source line, then rebuild. Run `dotnet build` locally to
    iterate; {code} can be searched on learn.microsoft.com for details.
  docs: https://learn.microsoft.com/dotnet/csharp/language-reference/compiler-messages/

- id: xunit-assert-failed
  ecosystem: dotnet
  category: test
  title: xUnit test assertion failed
  match: "(?<assert>Assert\\.\\w+\\(\\) Failure)"
  confidence: 0.65
  fix: |
    A test failed an assertion ({assert}). Compare the Expected vs Actual values
    in the lines that follow. Reproduce a single test with
    `dotnet test --filter FullyQualifiedName~<TestName>`.
  docs: https://xunit.net/docs/comparisons

- id: dotnet-sdk-not-found
  ecosystem: dotnet
  category: environment
  title: Required .NET SDK version not found
  match: "A compatible .NET SDK was not found|error NETSDK1045|requested SDK version"
  confidence: 0.75
  fix: |
    The build requested a .NET SDK version that isn't installed on this machine.
    Check global.json for a pinned SDK version and either install that SDK or
    relax/remove the version constraint.
  docs: https://learn.microsoft.com/dotnet/core/tools/global-json

- id: netsdk-assets-missing
  ecosystem: dotnet
  category: build
  title: project.assets.json missing — restore hasn't run
  match: "error NETSDK1004: Assets file '(?<file>[^']+)' not found"
  confidence: 0.9
  fix: |
    {file} is produced by restore, and the build ran without it. Add a `dotnet restore`
    step, or drop `--no-restore` from the build. In a Docker build this usually means the
    restore layer ran against a different set of project files than the build layer —
    check that every .csproj referenced by the solution is COPYed in before restore.
  docs: https://learn.microsoft.com/dotnet/core/tools/sdk-errors/netsdk1004

- id: nuget-nu1301
  ecosystem: dotnet
  category: network
  title: NuGet source unreachable
  match: "error NU1301: Unable to load the service index for source (?<source>\\S+?)\\.?$"
  confidence: 0.88
  fix: |
    NuGet could not read the feed at {source}. Either the host is unreachable from this
    runner (proxy/firewall/DNS), or it needs credentials the build doesn't have. For a
    private feed, add the token as a NuGet source credential; if the feed is simply gone,
    remove it from nuget.config — an unreachable source fails restore even when every
    package is available elsewhere.
  docs: https://learn.microsoft.com/nuget/reference/errors-and-warnings/nu1301

- id: msbuild-msb4018
  ecosystem: dotnet
  category: build
  title: An MSBuild task crashed
  match: "error MSB4018: The \"(?<task>[^\"]+)\" task failed unexpectedly"
  confidence: 0.8
  fix: |
    The '{task}' task threw instead of reporting an error, so the exception below is the
    real message — read that, not this line. Common causes are a missing file the task
    expected, a corrupted obj/ directory (delete it and rebuild), or a task assembly built
    against a different MSBuild version than the SDK in use.
  docs: https://learn.microsoft.com/visualstudio/msbuild/errors/msb4018

- id: mstest-assert-failed
  ecosystem: dotnet
  category: test
  title: MSTest assertion failed
  match: "Assert\\.(?<method>\\w+) failed\\.(?: Expected:<(?<expected>[^>]*)>\\. Actual:<(?<actual>[^>]*)>\\.)?"
  confidence: 0.75
  fix: |
    Assert.{method} failed — expected <{expected}>, got <{actual}>.
    The failing test's name is on the `Failed ...` line just above. Re-run only that one
    with `dotnet test --filter FullyQualifiedName~<TestName>`.
  docs: https://learn.microsoft.com/dotnet/core/testing/unit-testing-with-mstest

- id: nunit-assert-failed
  ecosystem: dotnet
  category: test
  title: NUnit assertion failed
  match: "Expected:\\s*(?<expected>[^\\n]+)\\n\\s*But was:\\s*(?<actual>[^\\n]+)"
  confidence: 0.75
  fix: |
    An NUnit assertion failed: expected {expected}, but was {actual}.
    The failing test's name is on the `Failed ...` line just above. Re-run only that one
    with `dotnet test --filter FullyQualifiedName~<TestName>`.
  docs: https://docs.nunit.org/articles/nunit/writing-tests/assertions/assertions.html

# ---- Analyzers, test hosts, audit and platform (#62) -----------------------------------------
# csc-compile-error matches CS codes only, so an analyzer or style diagnostic raised to an error -
# among the commonest .NET CI failures - fell through to generic rules or to nothing.

- id: dotnet-analyzer-error
  ecosystem: dotnet
  category: compile
  title: Analyzer rule raised to an error
  match: "error (?<code>(?:CA|IDE|SA|RS|RCS|VSTHRD|xUnit|MSTEST|NUnit)\\d+): (?<message>.+)"
  confidence: 0.75
  fix: |
    An analyzer reported {code} as an error: {message}
    It fails the build because its severity is error, through .editorconfig
    (dotnet_diagnostic.{code}.severity), TreatWarningsAsErrors, or AnalysisLevel /
    EnforceCodeStyleInBuild. Fix the code it points at; many style rules are fixed by
    `dotnet format`. To change the rule rather than the code, set its severity in
    .editorconfig, and keep the change reviewed like any other.
  docs: https://learn.microsoft.com/dotnet/fundamentals/code-analysis/configuration-options

- id: dotnet-format-verify
  ecosystem: dotnet
  category: build
  title: dotnet format found unformatted code
  match: "error (?<code>WHITESPACE|CHARSET|FINALNEWLINE|ENDOFLINE|IMPORTS): (?<message>.+)"
  confidence: 0.85
  fix: |
    `dotnet format --verify-no-changes` found code that is not formatted ({code}).
    Run `dotnet format` locally and commit the result. If it disagrees with your editor,
    the .editorconfig the build sees is the one to fix; line endings often differ
    between Windows and Linux checkouts (core.autocrlf, or a .gitattributes eol rule).
  docs: https://learn.microsoft.com/dotnet/core/tools/dotnet-format

- id: vstest-testhost-crashed
  ecosystem: dotnet
  category: test
  title: Test host crashed
  match: "The active test run was aborted\\. Reason: (?<reason>.+)|Test host process crashed(?<reason>.*)|^\\s*Test Run Aborted\\.?\\s*$"
  confidence: 0.8
  fix: |
    The process running the tests died, so no test after it reported a result. Common
    causes: a stack overflow, an unhandled exception on a background thread, an
    Environment.Exit or FailFast in code under test, or the runner killed for memory.
    Re-run with `dotnet test --blame-crash` (add --blame-crash-dump-type full) to get a
    dump and the test that was running, attached as a test result.
  docs: https://learn.microsoft.com/dotnet/core/tools/dotnet-test#options

- id: vstest-blame-hang
  ecosystem: dotnet
  category: test
  title: Test run hung and was stopped
  # Outranks vstest-testhost-crashed: a hang dump also ends the run "aborted".
  match: "The specified inactivity time of (?<timeout>.+?) has elapsed"
  confidence: 0.85
  fix: |
    No test finished within {timeout}, so the run was stopped and hang dumps collected.
    The Sequence file and the dump name the test that was running: look for a deadlock,
    a sync-over-async wait (.Result, .Wait()), or a wait on a network or service that
    never answers. --blame-hang-timeout sets the limit; give a slow test its own timeout
    rather than raising it for every test.
  docs: https://learn.microsoft.com/dotnet/core/tools/dotnet-test#options

- id: nuget-audit-vulnerability
  ecosystem: dotnet
  category: dependency
  title: Package with a known vulnerability
  # An error only: NuGetAudit warns by default, and a warning beside the real failure is not it.
  match: "error NU190[1-4]: Package '(?<package>[^']+)' (?<version>\\S+) has a known (?<severity>\\w+) severity vulnerability"
  confidence: 0.85
  fix: |
    '{package}' {version} has a known {severity} severity vulnerability, and warnings are
    errors in this build. Upgrade it (`dotnet list package --vulnerable --include-transitive`
    shows which version is fixed). A transitive one is upgraded by referencing the fixed
    version directly. Suppress one advisory only after reviewing it, with
    <NuGetAuditSuppress Include="advisory URL" />.
  docs: https://learn.microsoft.com/nuget/concepts/auditing-packages

- id: netsdk1100-windows-targeting
  ecosystem: dotnet
  category: environment
  title: Windows-only project built on Linux or macOS
  match: "error NETSDK1100: "
  confidence: 0.9
  fix: |
    A project targets Windows (WPF, WinForms, or a -windows framework) and is building on
    a non-Windows runner. Set <EnableWindowsTargeting>true</EnableWindowsTargeting> (in
    Directory.Build.props, or -p:EnableWindowsTargeting=true) to build it there, or build
    that project on windows-latest. Running its tests still needs Windows.
  docs: https://learn.microsoft.com/dotnet/core/tools/sdk-errors/netsdk1100

- id: msbuild-file-locked
  ecosystem: dotnet
  category: build
  title: Output file locked by another process
  match: "error MSB30(?:27|21): (?<message>.+)"
  confidence: 0.85
  fix: |
    MSBuild could not overwrite an output file because another process holds it: {message}
    Usually a test host, a dotnet build server or an app from an earlier step that is
    still running, or two builds of one project writing the same folder in parallel.
    Stop it first (`dotnet build-server shutdown`), and don't build a project twice
    concurrently into the same output path.
  docs: https://learn.microsoft.com/visualstudio/msbuild/errors/msb3027
