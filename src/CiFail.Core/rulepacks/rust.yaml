# Rust / Cargo rule pack

- id: rust-error-code
  ecosystem: rust
  category: compile
  title: Rust compile error
  match: "error\\[(?<code>E\\d{4})\\]: (?<message>.+)"
  confidence: 0.8
  fix: |
    The Rust compiler rejected the code ({code}): {message}
    Run `cargo build` locally to see the annotated source span, and
    `rustc --explain {code}` for a detailed explanation of this error class.
  docs: https://doc.rust-lang.org/error_codes/error-index.html

- id: rust-unresolved-import
  ecosystem: rust
  category: dependency
  title: Rust unresolved import / crate
  match: "error\\[E0432\\]: unresolved import `(?<import>[^`]+)`|error\\[E0433\\]: failed to resolve: (?<message>.+)"
  confidence: 0.82
  fix: |
    Rust couldn't resolve an import or path (see the error line above). Add the
    missing crate to Cargo.toml ([dependencies]) and run `cargo build`, check the
    `use` path, and confirm any feature gating the item is enabled.
  docs: https://doc.rust-lang.org/cargo/guide/dependencies.html

- id: cargo-could-not-compile
  ecosystem: rust
  category: build
  title: Cargo could not compile a crate
  match: "error: could not compile `(?<crate>[^`]+)`"
  confidence: 0.6
  fix: |
    Cargo aborted while compiling crate '{crate}'. The real cause is the error[E####]
    line(s) above this summary. Fix those, then re-run `cargo build`. Use
    `cargo build -v` for the exact rustc invocation.

- id: rust-test-panic
  ecosystem: rust
  category: test
  title: Rust test panicked / failed
  match: "thread '(?<thread>[^']+)' panicked at (?<location>[^\\n]+)|test result: FAILED\\. \\d+ passed; (?<failed>\\d+) failed"
  confidence: 0.65
  fix: |
    A Rust test failed. Read the panic message and location above for the assertion
    that fired. Reproduce with `cargo test <test_name> -- --nocapture` and set
    RUST_BACKTRACE=1 for a backtrace.
  docs: https://doc.rust-lang.org/book/ch11-01-writing-tests.html

- id: cargo-dependency-resolution
  ecosystem: rust
  category: dependency
  title: Cargo could not resolve dependencies
  match: "error: failed to select a version for [`'](?<crate>[^'`]+)|failed to resolve dependencies|could not find [`'](?<crate2>[^'`]+)[`'] in registry"
  confidence: 0.8
  fix: |
    Cargo couldn't pick compatible versions. Read the conflict it prints, relax or
    align version requirements in Cargo.toml, and run `cargo update`. Commit Cargo.lock
    (for binaries) so CI resolves exactly what you do.
  docs: https://doc.rust-lang.org/cargo/reference/resolver.html

- id: rust-toolchain-mismatch
  ecosystem: rust
  category: environment
  title: Rust toolchain too old / wrong channel
  match: "(?:package .* cannot be built because it requires rustc (?<version>[\\d.]+)|requires rustc (?<version2>[\\d.]+) or newer|this feature requires a nightly)"
  confidence: 0.8
  fix: |
    The crate needs a newer (or nightly) Rust than the runner has. Update the toolchain
    in CI (rustup, or the dtolnay/rust-toolchain action) to the required version, pin it
    with a rust-toolchain.toml, or lower the crate's rust-version if you can.

- id: cargo-lock-out-of-date
  ecosystem: rust
  category: dependency
  title: Cargo.lock out of date (--locked)
  match: "(?:the lock file .*needs to be updated but --locked was passed|Cargo\\.lock is out of date)"
  confidence: 0.8
  fix: |
    CI built with `--locked`/`--frozen` but Cargo.lock doesn't match Cargo.toml. Run
    `cargo update` (or `cargo build` without --locked) locally and commit the updated
    Cargo.lock so the lockfile and manifest agree.
