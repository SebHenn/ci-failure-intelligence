name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      # One version, everywhere. Catches a stray <Version> in a csproj and Helm appVersion
      # drift — the split that made every documented install path 404 in 0.1.0.
      - name: Check version consistency
        run: bash scripts/check-versions.sh

      # The release depends on these scripts being correct on macOS as well as Linux.
      - name: Lint shell scripts
        run: shellcheck scripts/*.sh

      # Exercise manifest templating offline against fake checksums, so a broken template or
      # an unsubstituted placeholder is caught on the PR rather than in a published release.
      - name: Check packaging manifests render
        run: |
          bash scripts/render-packaging.sh 9.9.9 tests/fixtures/dist-fake "$RUNNER_TEMP/pkg"
          jq empty "$RUNNER_TEMP/pkg/cifail.json"
          test "$(grep -c 'sha256 "' "$RUNNER_TEMP/pkg/cifail.rb")" = 4
          ! grep -q '@@' "$RUNNER_TEMP/pkg/cifail.rb" "$RUNNER_TEMP/pkg/cifail.json"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      # Lint the shipped rule packs (malformed regex / missing fields / duplicate ids).
      # Fails the build on any error so a bad pack can't be merged.
      - name: Validate rule packs
        run: dotnet run --project src/CiFail.Cli --configuration Release --no-build -- rules validate src/CiFail.Core/rulepacks

      # Integration tests skip here (CIFAIL_DB_IT unset) — the db-integration job runs them.
      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Pack (global tool)
        run: dotnet pack src/CiFail.Cli/CiFail.Cli.csproj --configuration Release --no-build --output ./nupkg

  # Build the image AND RUN IT. Building alone proves almost nothing here: the Dockerfile's
  # two base images are independent, so a runtime base that can't host the app still builds
  # clean and only fails when someone runs it. That is not hypothetical — a dependabot PR
  # proposing aspnet 8.0 -> 10.0 (which cannot host a net8.0 app; .NET rolls forward across
  # minors, not majors) would have merged green without this job.
  #
  # Single-arch on purpose: the release workflow does the multi-arch build, and QEMU'd arm64
  # would triple the time on every push for no extra signal about the app itself.
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the full image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: cifail:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run it
        run: |
          docker run --rm cifail:ci --version
          # `serve` only exists in the full build, so this also proves IncludeExternalDb
          # actually took effect in the image rather than silently producing a slim binary.
          docker run --rm cifail:ci serve --help
          # Exactly the command the README gives (the image's WORKDIR is already /work).
          docker run --rm -v "$PWD:/work" cifail:ci analyze samples/nuget-nu1101.log

  # Real external databases (Postgres/MySQL/SQL Server/MongoDB) via Testcontainers. Kept in
  # a separate job so the heavier, container-pulling tests don't slow the core pipeline.
  db-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Run external-DB contract tests
        env:
          CIFAIL_DB_IT: '1'
        run: dotnet test tests/CiFail.Providers.Tests/CiFail.Providers.Tests.csproj --configuration Release --verbosity normal
