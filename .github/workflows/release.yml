name: Release

# Cut a release by pushing a version tag, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}   # allow a manual dry-run (builds artifacts, skips release)

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # One Linux host cross-publishes self-contained single-file binaries for
      # every target RID (win/osx/linux). No per-OS runners needed.
      - name: Build all binaries
        run: bash scripts/publish.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cifail-binaries
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
