name: Release

# Cut a release by pushing a version tag, e.g.:
#   git tag v0.2.0 && git push origin v0.2.0
#
# The tag must match <Version> in Directory.Build.props — the `verify` job enforces that
# before anything is built, because a mismatch is what made every 0.1.0 install path 404.
#
# The GitHub Release is created as a DRAFT and only published by `finalize`, after the
# binaries, the NuGet package, the Docker image, the packaging manifests and a real
# end-to-end install smoke test have all succeeded. Nobody's `install.sh` can ever see a
# half-published release.
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}   # manual dry-run: builds and renders everything, publishes nothing

permissions:
  contents: write

jobs:
  # Gate everything on the version/tag agreeing and the shell scripts linting. Runs first so
  # a mistyped tag publishes nothing at all.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Check version matches the tag
        run: bash scripts/check-versions.sh "${{ github.ref_type == 'tag' && github.ref_name || '' }}"

      - name: Lint shell scripts
        run: shellcheck scripts/*.sh

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      # One Linux host cross-publishes self-contained single-file binaries for
      # every target RID (win/osx/linux). No per-OS runners needed.
      - name: Build all binaries
        run: bash scripts/publish.sh

      # Regression guard: the Windows archives used to be zipped before LICENSE/README were
      # copied in, so every .zip shipped without a license.
      - name: Check archives carry LICENSE
        run: |
          unzip -l dist/cifail-*-win-x64.zip | grep -q LICENSE
          tar -tzf dist/cifail-*-linux-x64.tar.gz | grep -q LICENSE

      # Rendered into dist/ alongside the binaries so the uploaded artifact is one flat
      # directory — the release job then globs it without guessing at path prefixes.
      # (publish.sh already wrote SHA256SUMS, so nothing here perturbs it.)
      - name: Render packaging manifests
        run: bash scripts/render-packaging.sh "$(bash scripts/version.sh)" dist dist

      # Every pattern sits under dist/, so the artifact is flat. Listing files explicitly
      # also keeps the six unpacked per-RID binaries (dist/<rid>/cifail) out of it.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cifail-binaries
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            dist/SHA256SUMS
            dist/cifail.rb
            dist/cifail.json

  # Create the release as a draft. Assets include the rendered Scoop manifest, which the
  # README installs via .../releases/latest/download/cifail.json.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: cifail-binaries

      - name: Publish GitHub Release (draft)
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            *.tar.gz
            *.zip
            *.sha256
            SHA256SUMS
            cifail.rb
            cifail.json

  # Packed from a clean checkout with no RuntimeIdentifier: PackAsTool and SelfContained are
  # mutually exclusive, so this must not reuse the publish workspace.
  #
  # Publishing uses nuget.org TRUSTED PUBLISHING (OIDC) — there is no long-lived API key in
  # this repo's secrets. The job asks GitHub for a short-lived signed token describing this
  # workflow run; nuget.org verifies that signature with GitHub, matches the claims against
  # the policy registered on the account, and returns an API key valid for one hour.
  #
  # The policy on nuget.org must name exactly:
  #   Repository Owner: SebHenn · Repository: ci-failure-intelligence · Workflow File: release.yml
  # with Environment left blank (this job declares none). Renaming this file breaks publishing.
  # https://learn.microsoft.com/nuget/nuget-org/trusted-publishing
  nuget:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # A job-level block replaces the workflow-level one, so contents must be restated.
    permissions:
      contents: read
      id-token: write   # lets this job mint the OIDC token nuget.org verifies. Required.
    env:
      # The `secrets` context is not available in a step-level `if`, so the presence check
      # reads it through `env`. NUGET_USER is the nuget.org profile name, not an email.
      NUGET_USER: ${{ secrets.NUGET_USER }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Pack global tool
        run: dotnet pack src/CiFail.Cli/CiFail.Cli.csproj --configuration Release --output nupkg

      # A published NuGet version can only ever be unlisted — never deleted, never replaced.
      # So assert the artifact is the one we mean before it becomes permanent.
      - name: Check the package identity
        run: |
          version="$(bash scripts/version.sh)"
          expected="nupkg/cifail.$version.nupkg"
          if [ ! -f "$expected" ]; then
            echo "error: expected $expected, but pack produced:" >&2
            ls -1 nupkg >&2
            exit 1
          fi
          echo "packing $expected"

      # Must run immediately before the push: the key lasts an hour and each OIDC token can
      # be exchanged exactly once.
      #
      # Step-level (not job-level) gating on NUGET_USER: a skipped JOB would also skip
      # `finalize` through `needs`, stranding the release as a permanent draft. A fork or a
      # clone without the secret still gets a green `verify → build → release` chain.
      - name: Log in to nuget.org (OIDC)
        id: login
        if: env.NUGET_USER != ''
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to nuget.org
        if: env.NUGET_USER != ''
        run: >
          dotnet nuget push "nupkg/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

  # The FULL Docker image (all DB providers + git) is published to GHCR. On a tag push it
  # is pushed; on a manual dispatch it's built only (dry-run), to validate the Dockerfile.
  docker:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/cifail
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=ci-dryrun,enable=${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Install from the real (still-draft) release using the exact command the README gives.
  # The macOS leg is the point: it is the only thing that catches BSD-vs-GNU breakage in
  # install.sh, which is how `grep -oP` and `sha256sum` shipped broken.
  smoke:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      # A draft release is not downloadable anonymously, so fetch its assets with the
      # workflow token and let install.sh read them over file:// via CIFAIL_BASE_URL.
      # This runs the REAL script — its RID detection, its BSD/GNU checksum shim, its
      # extract and install — which is the only way the macOS leg is worth anything.
      - name: Download the draft release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/assets"
          gh release download "${{ github.ref_name }}" --dir "$RUNNER_TEMP/assets" --pattern '*' --clobber
          ls -1 "$RUNNER_TEMP/assets"

      - name: Install via scripts/install.sh
        env:
          CIFAIL_VERSION: ${{ github.ref_name }}
          CIFAIL_INSTALL_DIR: ${{ runner.temp }}/bin
        run: |
          export CIFAIL_BASE_URL="file://$RUNNER_TEMP/assets"
          bash scripts/install.sh

      - name: Run the installed binary
        run: |
          "$RUNNER_TEMP/bin/cifail" --version
          "$RUNNER_TEMP/bin/cifail" analyze samples/nuget-nu1101.log

  # Only once everything is green: publish the release and move the major tag that the
  # documented `uses: SebHenn/ci-failure-intelligence@v1` resolves to.
  finalize:
    needs: [release, nuget, docker, smoke]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ github.ref_name }}" --draft=false --latest

      # The composite action's major version is tracked independently of the CLI version,
      # per the GitHub Actions convention. Prereleases (v0.2.0-rc1) must not move it.
      - name: Move the v1 major tag
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f v1 "${{ github.sha }}"
          git push --force origin v1
