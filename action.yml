name: 'cifail'
description: 'Explain a CI/build/test failure: what broke, whether it happened before, and how to fix it.'
branding:
  icon: 'search'
  color: 'red'

inputs:
  log:
    description: 'Path to the log file to analyze (relative to the workspace).'
    required: false
    default: ''
  args:
    description: 'Extra arguments passed to `cifail analyze` (e.g. "--type node").'
    required: false
    default: ''
  image:
    description: 'cifail Docker image to use.'
    required: false
    default: 'ghcr.io/sebhenn/cifail:latest'
  summary:
    description: 'Write the analysis to the GitHub Actions step summary.'
    required: false
    default: 'true'
  fail:
    description: "Propagate cifail's exit code (fail the step). Off by default — the action is informational and runs after a build already failed."
    required: false
    default: 'false'
  comment:
    description: 'Post/update the analysis as a pull-request comment (idempotent). Needs a token in GITHUB_TOKEN with pull-requests: write.'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - shell: bash
      env:
        INPUT_LOG: ${{ inputs.log }}
        INPUT_ARGS: ${{ inputs.args }}
        INPUT_IMAGE: ${{ inputs.image }}
        INPUT_SUMMARY: ${{ inputs.summary }}
        INPUT_FAIL: ${{ inputs.fail }}
        INPUT_COMMENT: ${{ inputs.comment }}
      run: |
        set -uo pipefail

        docker pull "$INPUT_IMAGE" >/dev/null 2>&1 || true

        run_args=(--rm -v "$PWD:/work" -w /work)
        # Pass shared-database config through to the container when configured.
        [ -n "${CIFAIL_DB_PROVIDER:-}" ] && run_args+=(-e CIFAIL_DB_PROVIDER)
        [ -n "${CIFAIL_DB_CONNECTION:-}" ] && run_args+=(-e CIFAIL_DB_CONNECTION)

        cifail_args=(analyze)
        [ -n "$INPUT_LOG" ] && cifail_args+=("$INPUT_LOG")
        # word-split extra args intentionally
        # shellcheck disable=SC2206
        [ -n "$INPUT_ARGS" ] && cifail_args+=($INPUT_ARGS)

        out="$(docker run "${run_args[@]}" "$INPUT_IMAGE" "${cifail_args[@]}" 2>&1)"
        code=$?

        echo "$out"

        if [ "$INPUT_SUMMARY" = "true" ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          {
            echo "## cifail analysis"
            echo ""
            echo '```'
            echo "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        fi

        # Post/update an idempotent PR comment (marked with an HTML comment so we update in place).
        if [ "$INPUT_COMMENT" = "true" ]; then
          pr="$(jq -r '.pull_request.number // .issue.number // empty' "$GITHUB_EVENT_PATH" 2>/dev/null)"
          if [ -z "${GITHUB_TOKEN:-}" ]; then
            echo "cifail: comment=true but GITHUB_TOKEN is not set — skipping PR comment." >&2
          elif [ -z "$pr" ]; then
            echo "cifail: comment=true but no pull request in this event — skipping PR comment." >&2
          else
            marker="<!-- cifail -->"
            body="$(printf '%s\n## cifail analysis\n\n```\n%s\n```\n' "$marker" "$out")"
            repo="$GITHUB_REPOSITORY"
            # Find our existing comment (by marker) and update it; otherwise create one.
            id="$(gh api "repos/$repo/issues/$pr/comments" --paginate \
              --jq "map(select(.body | startswith(\"$marker\"))) | .[0].id // empty" 2>/dev/null)"
            if [ -n "$id" ]; then
              gh api -X PATCH "repos/$repo/issues/comments/$id" -f body="$body" >/dev/null \
                && echo "cifail: updated PR comment $id."
            else
              gh api -X POST "repos/$repo/issues/$pr/comments" -f body="$body" >/dev/null \
                && echo "cifail: posted PR comment."
            fi
          fi
        fi

        # cifail exit codes: 0 matched, 1 analyzed but no rule matched, 2 input error.
        if [ "$INPUT_FAIL" = "true" ]; then
          exit $code
        fi
        exit 0
