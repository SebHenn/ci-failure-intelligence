name: 'cifail'
description: 'Explain a CI/build/test failure: what broke, whether it happened before, and how to fix it.'
branding:
  icon: 'search'
  color: 'red'

# NOTE: on Linux runners this action runs cifail's Docker image. On windows-* and macos-*
# runners, which have no Docker daemon, it downloads the same release's self-contained binary
# instead and checks it against the release's sha256 (the `runtime` input).

inputs:
  log:
    description: 'Path to the log file to analyze (relative to the workspace). Also accepts a directory or a glob.'
    required: false
    default: ''
  mode:
    description: 'What to run: "analyze" (explain the failure, informational) or "gate" (fail only on a failure absent from .cifail/baseline.txt).'
    required: false
    default: 'analyze'
  args:
    description: 'Extra arguments passed to the cifail command (e.g. "--type node", "--format trx").'
    required: false
    default: ''
  image:
    description: "cifail Docker image to use. Empty runs the image built from this action's own release (ghcr.io/sebhenn/cifail:<version>), so pinning the action pins the code that runs."
    required: false
    default: ''
  runtime:
    description: 'How cifail runs: "auto" (Docker on Linux, the release binary on Windows and macOS), "docker", or "binary" (the self-contained binary of this action''s release, verified against its sha256).'
    required: false
    default: 'auto'
  summary:
    description: 'Write the analysis to the GitHub Actions step summary.'
    required: false
    default: 'true'
  fail:
    description: "Propagate cifail's exit code (fail the step). Off by default — the action is informational and runs after a build already failed."
    required: false
    default: 'false'
  comment:
    description: 'Post/update the analysis as a pull-request comment (idempotent). Needs a token in GITHUB_TOKEN with pull-requests: write.'
    required: false
    default: 'false'
  sarif:
    description: 'Also write a SARIF 2.1.0 report to this path (relative to the workspace), e.g. "cifail.sarif". Upload it with github/codeql-action/upload-sarif to show findings in Code Scanning.'
    required: false
    default: ''
  rules:
    description: 'Extra directory of rule packs shipped by this repo (relative to the workspace). A pack committed at .cifail/rules is loaded automatically and needs no input.'
    required: false
    default: ''
  tia-report:
    description: "A dotnet-tia report from the pull request's selective run (dotnet-tia's report: input). When set, the JUnit or TRX reports in log: are also checked for failures of tests that selection skipped."
    required: false
    default: ''
  tia-artifact:
    description: "Instead of tia-report: the name of the artifact the pull request's run uploaded its dotnet-tia report as. The action finds the pull request this commit merged, downloads the artifact from the latest completed run of its head commit, and checks the report is from that commit. Needs actions: read and pull-requests: read."
    required: false
    default: ''
  github-token:
    description: 'Token for fetching tia-artifact. The PR comment uses GITHUB_TOKEN from the environment, as before.'
    required: false
    default: ${{ github.token }}

outputs:
  matched:
    description: 'true when cifail explained every input, false when at least one failure went unrecognized.'
    value: ${{ steps.cifail.outputs.matched }}
  rule:
    description: 'Rule id of the first root cause (empty when nothing matched).'
    value: ${{ steps.cifail.outputs.rule }}
  fingerprint:
    description: 'Fingerprint of the first failure — the same string cifail gate baselines on.'
    value: ${{ steps.cifail.outputs.fingerprint }}
  title:
    description: 'Human-readable title of the first root cause.'
    value: ${{ steps.cifail.outputs.title }}
  count:
    description: 'How many things were analyzed (a test report expands to one per failing test).'
    value: ${{ steps.cifail.outputs.count }}
  new-failures:
    description: 'gate mode only: how many failures were absent from the baseline.'
    value: ${{ steps.cifail.outputs.new-failures }}
  exit-code:
    description: "cifail's own exit code, whatever `fail` was set to. 0 ok, 1 negative result, 2 usage."
    value: ${{ steps.cifail.outputs.exit-code }}
  action-version:
    description: 'Version of this action itself — what `@v1` actually resolved to on this run.'
    value: ${{ steps.cifail.outputs.action-version }}
  selection-misses:
    description: 'With tia-report: how many failing tests the selection had skipped. Empty when they could not be checked.'
    value: ${{ steps.cifail.outputs.selection-misses }}
  image-digest:
    description: 'Immutable digest of the image that ran (`name@sha256:…`), for pinning or for reproducing a run.'
    value: ${{ steps.cifail.outputs.image-digest }}

runs:
  using: 'composite'
  steps:
    - id: cifail
      shell: bash
      env:
        INPUT_LOG: ${{ inputs.log }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_ARGS: ${{ inputs.args }}
        INPUT_IMAGE: ${{ inputs.image }}
        INPUT_RUNTIME: ${{ inputs.runtime }}
        INPUT_SUMMARY: ${{ inputs.summary }}
        INPUT_FAIL: ${{ inputs.fail }}
        INPUT_COMMENT: ${{ inputs.comment }}
        INPUT_SARIF: ${{ inputs.sarif }}
        INPUT_RULES: ${{ inputs.rules }}
        INPUT_TIA_REPORT: ${{ inputs.tia-report }}
        INPUT_TIA_ARTIFACT: ${{ inputs.tia-artifact }}
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        # Which build of this action is running. `@v1` is a moving tag, so the ref a consumer
        # wrote does not identify a build — this stamp does. Bumped with <Version> in
        # Directory.Build.props and enforced by scripts/check-versions.sh, so it cannot drift.
        CIFAIL_ACTION_VERSION: '0.6.0'
        # Empty for a local `uses: ./` checkout; that is reported as such rather than guessed.
        CIFAIL_ACTION_REF: ${{ github.action_ref }}
        CIFAIL_ACTION_REPO: ${{ github.action_repository }}
      run: |
        set -uo pipefail
        # The runner invokes this as `bash --noprofile --norc -e -o pipefail {0}`, so errexit is
        # inherited and `set -uo pipefail` does not clear it. Every `[ -n "$X" ] && arr+=(...)`
        # below returns 1 when X is empty, and cifail's own documented exit 1 ("nothing matched")
        # is a normal outcome for this action — under errexit each of those killed the step
        # instantly, before `code=$?`, before `cat /tmp/cifail.err`, and before the `fail:` input
        # could apply. The one step whose job is to explain a failure failed without explaining
        # itself. We check exit codes explicitly here, so turn errexit off.
        set +e

        case "$INPUT_MODE" in
          analyze|gate) ;;
          *) echo "cifail: unknown mode '$INPUT_MODE' (use analyze or gate)." >&2; exit 2 ;;
        esac

        # Git Bash on a Windows runner is handed Windows paths; mktemp and friends want its own.
        if command -v cygpath > /dev/null 2>&1; then
          if [ -n "${RUNNER_TEMP:-}" ]; then RUNNER_TEMP="$(cygpath -u "$RUNNER_TEMP")"; fi
          if [ -n "${RUNNER_TOOL_CACHE:-}" ]; then RUNNER_TOOL_CACHE="$(cygpath -u "$RUNNER_TOOL_CACHE")"; fi
        fi

        # ---- runtime -------------------------------------------------------------------
        # Docker on Linux, this release's own binary elsewhere (#61): windows-* and macos-*
        # runners have no Docker daemon, and a .NET test job often runs on windows-latest.
        runtime="${INPUT_RUNTIME:-auto}"
        case "$runtime" in
          auto)
            if [ -n "$INPUT_IMAGE" ] || [ "${RUNNER_OS:-Linux}" = "Linux" ]; then runtime=docker; else runtime=binary; fi ;;
          docker|binary) ;;
          *) echo "cifail: unknown runtime '$runtime' (use auto, docker or binary)." >&2; exit 2 ;;
        esac
        if [ "$runtime" = binary ] && [ -n "$INPUT_IMAGE" ]; then
          echo "cifail: image: names a Docker image, and runtime is binary. Set one or the other." >&2
          exit 2
        fi

        if [ "$runtime" = binary ]; then
          # The archive of this action's own release, so pinning the action pins the code that
          # runs, as the image tag does. CIFAIL_BINARY points at a binary already on disk.
          if [ -n "${CIFAIL_BINARY:-}" ]; then
            cifail_bin="$CIFAIL_BINARY"
            binary_desc="binary $CIFAIL_BINARY"
          else
            if [ -z "${CIFAIL_ACTION_VERSION:-}" ]; then
              echo "cifail: runtime is binary, and there is no version stamp to fetch one for." >&2
              exit 2
            fi
            case "${RUNNER_OS:-$(uname -s)}" in
              Windows|MINGW*|MSYS*|CYGWIN*) rid_os=win; ext=zip; exe=cifail.exe ;;
              macOS|Darwin) rid_os=osx; ext=tar.gz; exe=cifail ;;
              *) rid_os=linux; ext=tar.gz; exe=cifail ;;
            esac
            case "${RUNNER_ARCH:-$(uname -m)}" in
              ARM64|arm64|aarch64) rid_arch=arm64 ;;
              *) rid_arch=x64 ;;
            esac
            asset="cifail-$CIFAIL_ACTION_VERSION-$rid_os-$rid_arch.$ext"
            url="https://github.com/SebHenn/ci-failure-intelligence/releases/download/v$CIFAIL_ACTION_VERSION/$asset"
            # The tool cache survives between jobs on a self-hosted runner.
            bin_dir="${RUNNER_TOOL_CACHE:-${RUNNER_TEMP:-/tmp}}/cifail/$CIFAIL_ACTION_VERSION/$rid_os-$rid_arch"
            cifail_bin="$bin_dir/$exe"
            mkdir -p "$bin_dir"
            if [ ! -f "$bin_dir/$asset" ] || [ ! -f "$bin_dir/$asset.sha256" ]; then
              if ! curl -fsSL --retry 3 -o "$bin_dir/$asset" "$url" || ! curl -fsSL --retry 3 -o "$bin_dir/$asset.sha256" "$url.sha256"; then
                rm -f "$bin_dir/$asset" "$bin_dir/$asset.sha256"
                echo "cifail: could not download $url." >&2
                exit 2
              fi
            fi
            # Checked every run, cached or not: an archive that is not the published one is not run.
            expected="$(cut -d' ' -f1 < "$bin_dir/$asset.sha256" | tr -d '\r')"
            if command -v sha256sum > /dev/null 2>&1; then
              actual="$(sha256sum "$bin_dir/$asset" | cut -d' ' -f1)"
            else
              actual="$(shasum -a 256 "$bin_dir/$asset" | cut -d' ' -f1)"
            fi
            if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
              rm -f "$bin_dir/$asset" "$bin_dir/$asset.sha256" "$cifail_bin"
              echo "cifail: $asset has sha256 $actual, and the release publishes ${expected:-none}. Not running it." >&2
              exit 2
            fi
            if [ ! -f "$cifail_bin" ]; then
              if [ "$ext" = zip ]; then
                if command -v unzip > /dev/null 2>&1; then
                  unzip -q -o "$bin_dir/$asset" -d "$bin_dir"
                else
                  # Windows' own tar is bsdtar, which reads a zip; Git Bash's is GNU tar, which can't.
                  "$(cygpath -u "${SYSTEMROOT:-C:\Windows}")/System32/tar.exe" -xf "$bin_dir/$asset" -C "$bin_dir"
                fi
              else
                tar -xzf "$bin_dir/$asset" -C "$bin_dir"
              fi
              chmod +x "$cifail_bin" 2> /dev/null || true
            fi
            if [ ! -f "$cifail_bin" ]; then
              echo "cifail: $asset holds no $exe." >&2
              exit 2
            fi
            binary_desc="binary $asset sha256 $actual"
          fi
        fi

        # The image of this action's own release, not `:latest` (#37). With `:latest`, pinning
        # the action — to `@v1`, a version or a commit — pinned only this wrapper, and the code
        # that read the log was whatever `:latest` was when the runner pulled it. The stamp is
        # checked against the release tag, and `finalize` refuses to publish a release whose
        # image cannot be pulled, so this tag exists for every release.
        if [ "$runtime" = docker ] && [ -z "$INPUT_IMAGE" ]; then
          if [ -z "${CIFAIL_ACTION_VERSION:-}" ]; then
            echo "cifail: no image: input and no version stamp to derive one from." >&2
            exit 2
          fi
          INPUT_IMAGE="ghcr.io/sebhenn/cifail:$CIFAIL_ACTION_VERSION"
        fi

        # The whole workspace is mounted into the container below, so a token persisted in it is
        # readable by the image (#39). actions/checkout v5 and earlier write the job token into
        # .git/config unless given `persist-credentials: false`. v6 and later keep it under
        # $RUNNER_TEMP, which is not mounted, so only config files inside the workspace are
        # checked: the root checkout and one level down, for `path:` checkouts. The container
        # needs the workspace (the log, the reports, git history), so this warns rather than
        # hiding .git.
        if [ "$runtime" = docker ]; then
          for git_config in .git/config ./*/.git/config; do
            if [ -f "$git_config" ] && grep -qi 'extraheader' "$git_config"; then
              echo "::warning::cifail: $git_config holds a persisted credential, and the workspace is mounted into the cifail container, so the image can read it. Check out with 'persist-credentials: false', or use actions/checkout v6 or later."
            fi
          done

          docker pull "$INPUT_IMAGE" >/dev/null 2>&1 || true
        fi

        # ---- provenance ----------------------------------------------------------------
        # Name the build that is running, before it runs anything (issue #21). `@v1` is a
        # MOVING reference that follows the newest release, an `image:` input can be one too
        # (`:latest`), and a runner can serve either from cache. So a log
        # that shows only the analysis cannot answer "which cifail was this?", and a fix that
        # shipped weeks ago looks like a fix that does not work. Printing this first also means
        # it survives a `docker run` that dies.
        if [ -n "${CIFAIL_ACTION_REPO:-}" ] && [ -n "${CIFAIL_ACTION_REF:-}" ]; then
          pin="$CIFAIL_ACTION_REPO@$CIFAIL_ACTION_REF"
        else
          pin="local checkout"
        fi

        run_args=(--rm -v "$PWD:/work" -w /work)
        # Pass shared-database config through to the container when configured.
        if [ -n "${CIFAIL_DB_PROVIDER:-}" ]; then run_args+=(-e CIFAIL_DB_PROVIDER); fi
        if [ -n "${CIFAIL_DB_CONNECTION:-}" ]; then run_args+=(-e CIFAIL_DB_CONNECTION); fi

        # Either way, in the workspace: the binary inherits the environment and its paths.
        run_cifail() {
          if [ "$runtime" = docker ]; then
            docker run "${run_args[@]}" "$INPUT_IMAGE" "$@"
          else
            "$cifail_bin" "$@"
          fi
        }

        image_digest=""
        if [ "$runtime" = docker ]; then
          # RepoDigests is the immutable identity of what was actually pulled; the tag in
          # $INPUT_IMAGE is not. Empty for a locally-built image that was never pushed.
          image_digest="$(docker image inspect \
            --format '{{ if .RepoDigests }}{{ index .RepoDigests 0 }}{{ end }}' \
            "$INPUT_IMAGE" 2>/dev/null | tr -d '\r')"
          runtime_desc="image $INPUT_IMAGE"
          if [ -n "$image_digest" ]; then runtime_desc="image $INPUT_IMAGE@${image_digest#*@}"; fi
        else
          runtime_desc="$binary_desc"
        fi

        cli_version="$(run_cifail --version 2>/dev/null | tr -d '\r' | head -1)"
        provenance="cifail action ${CIFAIL_ACTION_VERSION:+v}${CIFAIL_ACTION_VERSION:-of unknown version} ($pin)"
        provenance="$provenance | cifail ${cli_version:-unknown} | $runtime_desc"
        echo "$provenance"

        # A markdown report for humans, JSON on stdout for the outputs. Both come from one run:
        # --report-out writes the file *and* leaves stdout to --json.
        report=".cifail-report.md"

        cifail_args=("$INPUT_MODE" --json)
        if [ -n "$INPUT_LOG" ]; then cifail_args+=("$INPUT_LOG"); fi
        if [ -n "$INPUT_ARGS" ]; then
          # word-split extra args intentionally
          # shellcheck disable=SC2206
          cifail_args+=($INPUT_ARGS)
        fi
        if [ -n "$INPUT_RULES" ]; then cifail_args+=(--rules "$INPUT_RULES"); fi

        # Reports are an analyze-only feature; gate's own --json carries the verdict.
        # Both --report pairs are honoured in one run. Images before 0.3.1 kept only the last
        # pair — hence the markdown guard below, which turns an older image passed as `image:`
        # into a warning rather than a blank step.
        if [ "$INPUT_MODE" = "analyze" ]; then
          cifail_args+=(--report markdown --report-out "$report")
          if [ -n "$INPUT_SARIF" ]; then cifail_args+=(--report sarif --report-out "$INPUT_SARIF"); fi
        fi

        # stderr is kept separate so warnings can't corrupt the JSON document (the CLI is careful
        # about this; folding the streams with 2>&1 would throw that away).
        json="$(run_cifail "${cifail_args[@]}" 2>/tmp/cifail.err)"
        code=$?
        cat /tmp/cifail.err >&2 || true

        # ---- outputs -------------------------------------------------------------------
        # A step output is a single `key=value` line, so any newline in a value would corrupt the
        # file and silently swallow the outputs after it — squash them. GITHUB_OUTPUT is defaulted
        # so the script stays runnable outside Actions (`set -u` would otherwise abort here).
        emit() {
          printf '%s=%s\n' "$1" "$(printf '%s' "$2" | tr '\n\r' '  ')" \
            >> "${GITHUB_OUTPUT:-/dev/null}"
        }
        emit "exit-code" "$code"
        emit "action-version" "${CIFAIL_ACTION_VERSION:-}"
        emit "image-digest" "$image_digest"

        if [ "$INPUT_MODE" = "gate" ]; then
          emit "matched" "$(printf '%s' "$json" | jq -r '.Passed // false' 2>/dev/null || echo false)"
          emit "new-failures" "$(printf '%s' "$json" | jq -r '.NewCount // 0' 2>/dev/null || echo 0)"
          emit "count" "$(printf '%s' "$json" | jq -r '(.NewCount // 0) + (.KnownCount // 0)' 2>/dev/null || echo 0)"
          emit "rule" "$(printf '%s' "$json" | jq -r '(.New // [])[0].RuleId // empty' 2>/dev/null || true)"
          emit "fingerprint" "$(printf '%s' "$json" | jq -r '(.New // [])[0].Fingerprint // empty' 2>/dev/null || true)"
          emit "title" "$(printf '%s' "$json" | jq -r '(.New // [])[0].Title // empty' 2>/dev/null || true)"
        else
          emit "matched" "$(printf '%s' "$json" | jq -r 'if length == 0 then true else all(.[]; .Matched) end' 2>/dev/null || echo false)"
          emit "count" "$(printf '%s' "$json" | jq -r 'length' 2>/dev/null || echo 0)"
          emit "rule" "$(printf '%s' "$json" | jq -r '.[0].RootCause.RuleId // empty' 2>/dev/null || true)"
          emit "fingerprint" "$(printf '%s' "$json" | jq -r '.[0].Fingerprint // empty' 2>/dev/null || true)"
          emit "title" "$(printf '%s' "$json" | jq -r '.[0].RootCause.Title // empty' 2>/dev/null || true)"
          emit "new-failures" ""
        fi

        # ---- selection misses (dotnet-tia) ---------------------------------------------
        # The full run's failures against what the pull request's selection skipped (#46). A
        # report that is missing, or inputs with no JUnit or TRX in them, are a warning, an
        # empty output and a "Not checked" section, never "no miss" and never silence: a
        # comment without the section would read as "no miss" too (#50).
        misses_md=""
        misses_code=0
        # Each list is capped: a mass failure is when this section matters most, and an uncapped
        # one is what pushes it out of a comment GitHub will accept (#59).
        # shellcheck disable=SC2016 # jq's $n, not the shell's.
        jq_lists='def span: "`" + (gsub("`"; [39] | implode)) + "`";
          def capped($n; f): (.[:$n][] | f), (if length > $n then "- ... and \(length - $n) more; `cifail selection-misses --json` lists every one." else empty end);'
        INPUT_TIA_REPORT="${INPUT_TIA_REPORT:-}"
        INPUT_TIA_ARTIFACT="${INPUT_TIA_ARTIFACT:-}"
        misses_unchecked() {
          echo "::warning::cifail: selection misses were not checked: ${1//%/%25}"
          emit "selection-misses" ""
          misses_md="$(printf '### Candidate selection misses\n\nNot checked: %s' "$1")"
        }

        # Two commits are one when either names the other: a short SHA and a full one.
        same_commit() {
          local a b
          a="$(printf '%s' "$1" | tr '[:upper:]' '[:lower:]')"
          b="$(printf '%s' "$2" | tr '[:upper:]' '[:lower:]')"
          [ "${#a}" -ge 7 ] && [ "${#b}" -ge 7 ] && { [[ "$a" == "$b"* ]] || [[ "$b" == "$a"* ]]; }
        }

        # The report lives in another workflow run: the pull request's (#58). The pull request is
        # the one this commit merged, found through the API, which also works for a squash or a
        # rebase merge. A squash commit is no descendant of the pull request's head, so the head
        # is taken from the pull request, and the report has to be from exactly that commit.
        tia_pr=""
        tia_expect_head=""
        tia_fetch_error=""
        fetch_tia_artifact() {
          local -x GH_TOKEN="${INPUT_GITHUB_TOKEN:-${GITHUB_TOKEN:-}}"
          local repo="${GITHUB_REPOSITORY:-}" pulls pr runs run found="" dir reports
          if ! command -v gh > /dev/null 2>&1; then
            tia_fetch_error="tia-artifact needs the gh CLI, and this runner has none."
            return 1
          fi
          if ! pulls="$(gh api "repos/$repo/commits/$GITHUB_SHA/pulls" 2>/tmp/cifail-gh.err)"; then
            tia_fetch_error="could not look up the pull request of $GITHUB_SHA ($(head -c 300 /tmp/cifail-gh.err)). The token needs pull-requests: read."
            return 1
          fi
          pr="$(jq -r --arg sha "$GITHUB_SHA" '(map(select(.merge_commit_sha == $sha)) + .)[0] // empty | "\(.number) \(.head.sha)"' <<< "$pulls" 2>/dev/null)"
          if [ -z "$pr" ]; then
            tia_fetch_error="no pull request is associated with $GITHUB_SHA, so there is no selection to check its failures against."
            return 1
          fi
          tia_pr="${pr%% *}"
          tia_expect_head="${pr#* }"
          if ! runs="$(gh api "repos/$repo/actions/runs?head_sha=$tia_expect_head&status=completed&per_page=100" --jq '.workflow_runs[].id' 2>/tmp/cifail-gh.err)"; then
            tia_fetch_error="could not list the runs of pull request #$tia_pr ($(head -c 300 /tmp/cifail-gh.err)). The token needs actions: read."
            return 1
          fi
          # Newest first, so a re-run's report wins over the one it replaced.
          for run in $runs; do
            if [ -n "$(gh api "repos/$repo/actions/runs/$run/artifacts?name=$INPUT_TIA_ARTIFACT" --jq '.artifacts[] | select(.expired | not) | .id' 2>/dev/null)" ]; then
              found="$run"
              break
            fi
          done
          if [ -z "$found" ]; then
            tia_fetch_error="no completed run of pull request #$tia_pr's head $tia_expect_head has an unexpired artifact named '$INPUT_TIA_ARTIFACT'."
            return 1
          fi
          dir="$(mktemp -d "${RUNNER_TEMP:-/tmp}/cifail-tia.XXXXXX")"
          if ! gh run download "$found" -R "$repo" -n "$INPUT_TIA_ARTIFACT" -D "$dir" > /dev/null 2>/tmp/cifail-gh.err; then
            tia_fetch_error="could not download '$INPUT_TIA_ARTIFACT' from run $found ($(head -c 300 /tmp/cifail-gh.err))."
            return 1
          fi
          reports="$(find "$dir" -type f -name '*.json')"
          if [ "$(printf '%s' "$reports" | grep -c .)" -ne 1 ]; then
            tia_fetch_error="artifact '$INPUT_TIA_ARTIFACT' from run $found should hold one .json report, and holds $(printf '%s' "$reports" | grep -c .)."
            return 1
          fi
          INPUT_TIA_REPORT="$reports"
          echo "cifail: checking against the dotnet-tia report of pull request #$tia_pr ($tia_expect_head), from run $found."
        }
        if [ -n "$INPUT_TIA_ARTIFACT" ] && [ -z "$INPUT_TIA_REPORT" ]; then
          fetch_tia_artifact || true
        fi

        tia_report_head=""
        if [ -n "$INPUT_TIA_REPORT" ] && [ -f "$INPUT_TIA_REPORT" ]; then
          tia_report_head="$(jq -r '.headCommit // empty' "$INPUT_TIA_REPORT" 2>/dev/null)"
        fi

        if [ -n "$tia_fetch_error" ]; then
          misses_unchecked "$tia_fetch_error"
        elif [ -n "$INPUT_TIA_REPORT" ]; then
          if [ ! -f "$INPUT_TIA_REPORT" ]; then
            misses_unchecked "tia-report '$INPUT_TIA_REPORT' does not exist. Was the pull request's report downloaded?"
          elif [ -z "$INPUT_LOG" ]; then
            misses_unchecked "tia-report is set but log: is empty, so there were no test reports to check."
          elif [ -n "$tia_expect_head" ] && ! same_commit "$tia_report_head" "$tia_expect_head"; then
            # Another push of the pull request, or another pull request: its candidates would be
            # confident and wrong, and its "None" would be worse.
            misses_unchecked "the report is from ${tia_report_head:-an unrecorded commit}, and pull request #$tia_pr's head is $tia_expect_head."
          else
            misses_args=(--json --commit "${GITHUB_SHA:-HEAD}" "$INPUT_LOG")
            if [ "$runtime" = docker ]; then
              # Mounted on its own, read-only, so an absolute path works too: the container sees
              # only the workspace, at /work, and runner.temp is outside it (#50).
              tia_abs="$(cd "$(dirname -- "$INPUT_TIA_REPORT")" && pwd -P)/$(basename -- "$INPUT_TIA_REPORT")"
              tia_mount=/cifail-tia/report.json
              misses_json="$(docker run "${run_args[@]}" -v "$tia_abs:$tia_mount:ro" "$INPUT_IMAGE" selection-misses --tia "$tia_mount" "${misses_args[@]}" 2>/tmp/cifail-misses.err)"
            else
              misses_json="$("$cifail_bin" selection-misses --tia "$INPUT_TIA_REPORT" "${misses_args[@]}" 2>/tmp/cifail-misses.err)"
            fi
            misses_code=$?
            cat /tmp/cifail-misses.err >&2 || true
            misses_count="$(printf '%s' "$misses_json" | jq -r '.misses | length' 2>/dev/null)"
            if [ "$misses_code" -le 1 ] && [ -n "$misses_count" ]; then
              emit "selection-misses" "$misses_count"
              failing="$(printf '%s' "$misses_json" | jq -r '.failingTests // 0')"
              unmatched_count="$(printf '%s' "$misses_json" | jq -r '.unmatched // [] | length')"
              unchecked_projects="$(printf '%s' "$misses_json" | jq -r '.uncheckedProjects // [] | length')"
              if [ "$misses_count" -eq 0 ] && [ "$unmatched_count" -gt 0 ]; then
                # Not "None": these may be skipped tests, and which ones is not known (#56).
                misses_md="$(printf '### Selection misses\n\nNot certain: no failing test that could be matched was skipped by the dotnet-tia selection, but %s of the %s could not be matched to one test.' "$unmatched_count" "$failing")"
              elif [ "$misses_count" -eq 0 ] && [ "$unchecked_projects" -gt 0 ]; then
                # Nor here: a failure may be from a project the selection skipped whole (#57).
                misses_md="$(printf '### Selection misses\n\nNot certain: no failing test that could be matched was skipped by the dotnet-tia selection, but it skipped %s test project(s) whole whose failures could not be recognised.' "$unchecked_projects")"
              elif [ "$misses_count" -gt 0 ]; then
                misses_md="$(printf '### Candidate selection misses\n\n%s of %s failing test(s) were skipped by the dotnet-tia selection. A skipped test can fail for an unrelated reason; `dotnet tia explain <test>` at the pull request'"'"'s commit says whether the change reached it.' "$misses_count" "$failing")"
                # $(...) drops trailing newlines, so the blank line before the list is added here.
                # Names and messages come from the pull request's code, so both go in code spans,
                # where markdown stays inert; a backtick in them would end the span, so it becomes
                # an apostrophe ([39] | implode, since this program can't contain a quote).
                misses_md="$misses_md"$'\n\n'"$(printf '%s' "$misses_json" | jq -r "$jq_lists"' .misses | capped(50; "- " + (.test // "" | span) + " (" + (.project // "" | span) + ")" + (if .history then " - failed \(.history.failures)x on \(.history.distinctDays) day(s) before" + (if .history.flaky then ", flaky" else ", likely flaky" end) else "" end) + (if (.message // "") != "" then ": " + (.message | split("\n")[0] | .[0:300] | span) else "" end))')"
              else
                misses_md="$(printf '### Selection misses\n\nNone: no failing test of the %s was skipped by the dotnet-tia selection.' "$failing")"
              fi
              if [ "$unmatched_count" -gt 0 ]; then
                misses_md="$misses_md"$'\n\n'"Not checked: the report names these only by method, and more than one skipped test has that name:"$'\n\n'"$(printf '%s' "$misses_json" | jq -r "$jq_lists"' .unmatched | capped(20; "- " + (.test // "" | span) + " could be " + ([.candidates[] | span] | join(", ")))')"
              fi
              if [ "$unchecked_projects" -gt 0 ]; then
                misses_md="$misses_md"$'\n\n'"Not checked: the selection skipped these test projects whole, and a failure from them could not be recognised:"$'\n\n'"$(printf '%s' "$misses_json" | jq -r "$jq_lists"' .uncheckedProjects | capped(20; "- " + (.project // "" | span) + ": " + (.reason // ""))')"
              fi
            else
              misses_unchecked "selection-misses could not check the reports (exit $misses_code)."
              misses_code=0
            fi
          fi
        fi

        # ---- human-readable rendering --------------------------------------------------
        # The markdown report, not the console panels: box-drawing characters inside a code
        # fence is what a step summary used to be, and it reads badly everywhere it lands.
        if [ "$INPUT_MODE" = "analyze" ] && [ -s "$report" ]; then
          body="$(cat "$report")"
        else
          if [ "$INPUT_MODE" = "analyze" ]; then
            echo "::warning::cifail produced no markdown report; showing raw JSON instead." \
              "If you passed sarif:, the image may predate the fix for two --report pairs."
          fi
          body="$(printf '%s' "$json")"
        fi

        # First: it is the signal across both tools, and a body cut to fit loses its end (#59).
        if [ -n "$misses_md" ]; then
          body="$(printf '%s\n\n%s' "$misses_md" "$body")"
        fi

        echo "$body"

        # GitHub refuses a comment over 65,536 characters and drops a step summary over 1 MiB.
        # Measured in bytes, which are never fewer than characters; a code block the cut leaves
        # open is closed, and the reader is told where the rest is.
        run_url="${GITHUB_SERVER_URL:-https://github.com}/${GITHUB_REPOSITORY:-}/actions/runs/${GITHUB_RUN_ID:-}"
        fit() {
          local LC_ALL=C
          local limit="$1" text="$2" cut fences
          if [ "${#text}" -le "$limit" ]; then
            printf '%s' "$text"
            return
          fi
          cut="${text:0:$((limit - 200))}"
          if command -v iconv > /dev/null 2>&1; then
            # A multi-byte character the cut split in two. -c drops it, and exits 1 for that.
            cut="$(iconv -f UTF-8 -t UTF-8 -c <<< "$cut" || true)"
          fi
          fences="$(grep -c '^```' <<< "$cut" || true)"
          if [ $((fences % 2)) -eq 1 ]; then
            cut="$cut"$'\n''```'
          fi
          printf '%s\n\n_Cut to fit. The whole analysis is in the [run log](%s)._' "$cut" "$run_url"
        }

        # The provenance line goes wherever the analysis goes — the summary and the PR comment
        # are where someone reads this, and "which build ran?" is asked precisely when the
        # analysis looks wrong.
        if [ "$INPUT_SUMMARY" = "true" ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          {
            echo "## cifail"
            echo ""
            fit 1000000 "$body"
            echo ""
            echo ""
            echo "<sub>$provenance</sub>"
          } >> "$GITHUB_STEP_SUMMARY"
        fi

        # Post/update an idempotent PR comment (marked with an HTML comment so we update in place).
        if [ "$INPUT_COMMENT" = "true" ]; then
          pr="$(jq -r '.pull_request.number // .issue.number // empty' "$GITHUB_EVENT_PATH" 2>/dev/null)"
          if [ -z "${GITHUB_TOKEN:-}" ]; then
            echo "cifail: comment=true but GITHUB_TOKEN is not set — skipping PR comment." >&2
          elif [ -z "$pr" ]; then
            echo "cifail: comment=true but no pull request in this event — skipping PR comment." >&2
          else
            marker="<!-- cifail -->"
            # On stdin as JSON, not in argv, which Linux caps at 128 KiB per argument (#59).
            comment_file="$(mktemp)"
            printf '%s\n## cifail\n\n%s\n\n<sub>%s</sub>\n' "$marker" "$(fit 64000 "$body")" "$provenance" \
              | jq -Rs '{body: .}' > "$comment_file"
            repo="$GITHUB_REPOSITORY"
            # Find our existing comment (by marker) and update it; otherwise create one.
            id="$(gh api "repos/$repo/issues/$pr/comments" --paginate \
              --jq "map(select(.body | startswith(\"$marker\"))) | .[0].id // empty" 2>/dev/null)"
            # A failure is said where it is seen: the step stays green, so stderr alone is missed.
            if [ -n "$id" ]; then
              if gh api -X PATCH "repos/$repo/issues/comments/$id" --input "$comment_file" > /dev/null; then
                echo "cifail: updated PR comment $id."
              else
                echo "::warning::cifail: could not update PR comment $id. The job needs permissions: pull-requests: write."
              fi
            else
              if gh api -X POST "repos/$repo/issues/$pr/comments" --input "$comment_file" > /dev/null; then
                echo "cifail: posted PR comment."
              else
                echo "::warning::cifail: could not post the PR comment. The job needs permissions: pull-requests: write."
              fi
            fi
            rm -f "$comment_file"
          fi
        fi

        rm -f "$report"

        # cifail exit codes: 0 ok, 1 negative result (no rule matched / gate found something
        # new), 2 usage error.
        # A selection miss is a negative result like any other, once the analysis itself passed.
        if [ "$INPUT_FAIL" = "true" ]; then
          if [ "$code" -eq 0 ] && [ "$misses_code" -ne 0 ]; then
            exit "$misses_code"
          fi
          exit $code
        fi
        exit 0
