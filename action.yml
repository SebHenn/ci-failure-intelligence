name: 'cifail'
description: 'Explain a CI/build/test failure: what broke, whether it happened before, and how to fix it.'
branding:
  icon: 'search'
  color: 'red'

# NOTE: this action runs cifail through Docker, so it works on **Linux runners only**
# (ubuntu-*). It will not run on windows-* or macos-* runners, which have no Docker daemon.
# On those, install the CLI directly — see the README's install section.

inputs:
  log:
    description: 'Path to the log file to analyze (relative to the workspace). Also accepts a directory or a glob.'
    required: false
    default: ''
  mode:
    description: 'What to run: "analyze" (explain the failure, informational) or "gate" (fail only on a failure absent from .cifail/baseline.txt).'
    required: false
    default: 'analyze'
  args:
    description: 'Extra arguments passed to the cifail command (e.g. "--type node", "--format trx").'
    required: false
    default: ''
  image:
    description: 'cifail Docker image to use.'
    required: false
    default: 'ghcr.io/sebhenn/cifail:latest'
  summary:
    description: 'Write the analysis to the GitHub Actions step summary.'
    required: false
    default: 'true'
  fail:
    description: "Propagate cifail's exit code (fail the step). Off by default — the action is informational and runs after a build already failed."
    required: false
    default: 'false'
  comment:
    description: 'Post/update the analysis as a pull-request comment (idempotent). Needs a token in GITHUB_TOKEN with pull-requests: write.'
    required: false
    default: 'false'
  sarif:
    description: 'Also write a SARIF 2.1.0 report to this path (relative to the workspace), e.g. "cifail.sarif". Upload it with github/codeql-action/upload-sarif to show findings in Code Scanning.'
    required: false
    default: ''
  rules:
    description: 'Extra directory of rule packs shipped by this repo (relative to the workspace). A pack committed at .cifail/rules is loaded automatically and needs no input.'
    required: false
    default: ''

outputs:
  matched:
    description: 'true when cifail explained every input, false when at least one failure went unrecognized.'
    value: ${{ steps.cifail.outputs.matched }}
  rule:
    description: 'Rule id of the first root cause (empty when nothing matched).'
    value: ${{ steps.cifail.outputs.rule }}
  fingerprint:
    description: 'Fingerprint of the first failure — the same string cifail gate baselines on.'
    value: ${{ steps.cifail.outputs.fingerprint }}
  title:
    description: 'Human-readable title of the first root cause.'
    value: ${{ steps.cifail.outputs.title }}
  count:
    description: 'How many things were analyzed (a test report expands to one per failing test).'
    value: ${{ steps.cifail.outputs.count }}
  new-failures:
    description: 'gate mode only: how many failures were absent from the baseline.'
    value: ${{ steps.cifail.outputs.new-failures }}
  exit-code:
    description: "cifail's own exit code, whatever `fail` was set to. 0 ok, 1 negative result, 2 usage."
    value: ${{ steps.cifail.outputs.exit-code }}
  action-version:
    description: 'Version of this action itself — what `@v1` actually resolved to on this run.'
    value: ${{ steps.cifail.outputs.action-version }}
  image-digest:
    description: 'Immutable digest of the image that ran (`name@sha256:…`), for pinning or for reproducing a run.'
    value: ${{ steps.cifail.outputs.image-digest }}

runs:
  using: 'composite'
  steps:
    - id: cifail
      shell: bash
      env:
        INPUT_LOG: ${{ inputs.log }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_ARGS: ${{ inputs.args }}
        INPUT_IMAGE: ${{ inputs.image }}
        INPUT_SUMMARY: ${{ inputs.summary }}
        INPUT_FAIL: ${{ inputs.fail }}
        INPUT_COMMENT: ${{ inputs.comment }}
        INPUT_SARIF: ${{ inputs.sarif }}
        INPUT_RULES: ${{ inputs.rules }}
        # Which build of this action is running. `@v1` is a moving tag, so the ref a consumer
        # wrote does not identify a build — this stamp does. Bumped with <Version> in
        # Directory.Build.props and enforced by scripts/check-versions.sh, so it cannot drift.
        CIFAIL_ACTION_VERSION: '0.3.1'
        # Empty for a local `uses: ./` checkout; that is reported as such rather than guessed.
        CIFAIL_ACTION_REF: ${{ github.action_ref }}
        CIFAIL_ACTION_REPO: ${{ github.action_repository }}
      run: |
        set -uo pipefail
        # The runner invokes this as `bash --noprofile --norc -e -o pipefail {0}`, so errexit is
        # inherited and `set -uo pipefail` does not clear it. Every `[ -n "$X" ] && arr+=(...)`
        # below returns 1 when X is empty, and cifail's own documented exit 1 ("nothing matched")
        # is a normal outcome for this action — under errexit each of those killed the step
        # instantly, before `code=$?`, before `cat /tmp/cifail.err`, and before the `fail:` input
        # could apply. The one step whose job is to explain a failure failed without explaining
        # itself. We check exit codes explicitly here, so turn errexit off.
        set +e

        case "$INPUT_MODE" in
          analyze|gate) ;;
          *) echo "cifail: unknown mode '$INPUT_MODE' (use analyze or gate)." >&2; exit 2 ;;
        esac

        docker pull "$INPUT_IMAGE" >/dev/null 2>&1 || true

        # ---- provenance ----------------------------------------------------------------
        # Name the build that is running, before it runs anything (issue #21). Both things a
        # consumer pins are MOVING references: `@v1` follows the newest release, and the default
        # `:latest` image moves with it — and a runner can serve either from cache. So a log
        # that shows only the analysis cannot answer "which cifail was this?", and a fix that
        # shipped weeks ago looks like a fix that does not work. Printing this first also means
        # it survives a `docker run` that dies.
        if [ -n "${CIFAIL_ACTION_REPO:-}" ] && [ -n "${CIFAIL_ACTION_REF:-}" ]; then
          pin="$CIFAIL_ACTION_REPO@$CIFAIL_ACTION_REF"
        else
          pin="local checkout"
        fi

        # RepoDigests is the immutable identity of what was actually pulled; the tag in
        # $INPUT_IMAGE is not. Empty for a locally-built image that was never pushed.
        image_digest="$(docker image inspect \
          --format '{{ if .RepoDigests }}{{ index .RepoDigests 0 }}{{ end }}' \
          "$INPUT_IMAGE" 2>/dev/null | tr -d '\r')"
        image_desc="$INPUT_IMAGE"
        if [ -n "$image_digest" ]; then image_desc="$INPUT_IMAGE@${image_digest#*@}"; fi

        cli_version="$(docker run --rm "$INPUT_IMAGE" --version 2>/dev/null | tr -d '\r' | head -1)"
        provenance="cifail action ${CIFAIL_ACTION_VERSION:+v}${CIFAIL_ACTION_VERSION:-of unknown version} ($pin)"
        provenance="$provenance | cifail ${cli_version:-unknown} | image $image_desc"
        echo "$provenance"

        run_args=(--rm -v "$PWD:/work" -w /work)
        # Pass shared-database config through to the container when configured.
        if [ -n "${CIFAIL_DB_PROVIDER:-}" ]; then run_args+=(-e CIFAIL_DB_PROVIDER); fi
        if [ -n "${CIFAIL_DB_CONNECTION:-}" ]; then run_args+=(-e CIFAIL_DB_CONNECTION); fi

        # A markdown report for humans, JSON on stdout for the outputs. Both come from one run:
        # --report-out writes the file *and* leaves stdout to --json.
        report=".cifail-report.md"

        cifail_args=("$INPUT_MODE" --json)
        if [ -n "$INPUT_LOG" ]; then cifail_args+=("$INPUT_LOG"); fi
        if [ -n "$INPUT_ARGS" ]; then
          # word-split extra args intentionally
          # shellcheck disable=SC2206
          cifail_args+=($INPUT_ARGS)
        fi
        if [ -n "$INPUT_RULES" ]; then cifail_args+=(--rules "$INPUT_RULES"); fi

        # Reports are an analyze-only feature; gate's own --json carries the verdict.
        # Both --report pairs are honoured in one run. Older images kept only the last pair, and
        # ghcr.io/sebhenn/cifail:latest only moves on a release tag — hence the markdown guard
        # below, which turns a pinned older image into a warning rather than a blank step.
        if [ "$INPUT_MODE" = "analyze" ]; then
          cifail_args+=(--report markdown --report-out "$report")
          if [ -n "$INPUT_SARIF" ]; then cifail_args+=(--report sarif --report-out "$INPUT_SARIF"); fi
        fi

        # stderr is kept separate so warnings can't corrupt the JSON document (the CLI is careful
        # about this; folding the streams with 2>&1 would throw that away).
        json="$(docker run "${run_args[@]}" "$INPUT_IMAGE" "${cifail_args[@]}" 2>/tmp/cifail.err)"
        code=$?
        cat /tmp/cifail.err >&2 || true

        # ---- outputs -------------------------------------------------------------------
        # A step output is a single `key=value` line, so any newline in a value would corrupt the
        # file and silently swallow the outputs after it — squash them. GITHUB_OUTPUT is defaulted
        # so the script stays runnable outside Actions (`set -u` would otherwise abort here).
        emit() {
          printf '%s=%s\n' "$1" "$(printf '%s' "$2" | tr '\n\r' '  ')" \
            >> "${GITHUB_OUTPUT:-/dev/null}"
        }
        emit "exit-code" "$code"
        emit "action-version" "${CIFAIL_ACTION_VERSION:-}"
        emit "image-digest" "$image_digest"

        if [ "$INPUT_MODE" = "gate" ]; then
          emit "matched" "$(printf '%s' "$json" | jq -r '.Passed // false' 2>/dev/null || echo false)"
          emit "new-failures" "$(printf '%s' "$json" | jq -r '.NewCount // 0' 2>/dev/null || echo 0)"
          emit "count" "$(printf '%s' "$json" | jq -r '(.NewCount // 0) + (.KnownCount // 0)' 2>/dev/null || echo 0)"
          emit "rule" "$(printf '%s' "$json" | jq -r '(.New // [])[0].RuleId // empty' 2>/dev/null || true)"
          emit "fingerprint" "$(printf '%s' "$json" | jq -r '(.New // [])[0].Fingerprint // empty' 2>/dev/null || true)"
          emit "title" "$(printf '%s' "$json" | jq -r '(.New // [])[0].Title // empty' 2>/dev/null || true)"
        else
          emit "matched" "$(printf '%s' "$json" | jq -r 'if length == 0 then true else all(.[]; .Matched) end' 2>/dev/null || echo false)"
          emit "count" "$(printf '%s' "$json" | jq -r 'length' 2>/dev/null || echo 0)"
          emit "rule" "$(printf '%s' "$json" | jq -r '.[0].RootCause.RuleId // empty' 2>/dev/null || true)"
          emit "fingerprint" "$(printf '%s' "$json" | jq -r '.[0].Fingerprint // empty' 2>/dev/null || true)"
          emit "title" "$(printf '%s' "$json" | jq -r '.[0].RootCause.Title // empty' 2>/dev/null || true)"
          emit "new-failures" ""
        fi

        # ---- human-readable rendering --------------------------------------------------
        # The markdown report, not the console panels: box-drawing characters inside a code
        # fence is what a step summary used to be, and it reads badly everywhere it lands.
        if [ "$INPUT_MODE" = "analyze" ] && [ -s "$report" ]; then
          body="$(cat "$report")"
        else
          if [ "$INPUT_MODE" = "analyze" ]; then
            echo "::warning::cifail produced no markdown report; showing raw JSON instead." \
              "If you passed sarif:, the image may predate the fix for two --report pairs."
          fi
          body="$(printf '%s' "$json")"
        fi

        echo "$body"

        # The provenance line goes wherever the analysis goes — the summary and the PR comment
        # are where someone reads this, and "which build ran?" is asked precisely when the
        # analysis looks wrong.
        if [ "$INPUT_SUMMARY" = "true" ] && [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          {
            echo "## cifail"
            echo ""
            echo "$body"
            echo ""
            echo "<sub>$provenance</sub>"
          } >> "$GITHUB_STEP_SUMMARY"
        fi

        # Post/update an idempotent PR comment (marked with an HTML comment so we update in place).
        if [ "$INPUT_COMMENT" = "true" ]; then
          pr="$(jq -r '.pull_request.number // .issue.number // empty' "$GITHUB_EVENT_PATH" 2>/dev/null)"
          if [ -z "${GITHUB_TOKEN:-}" ]; then
            echo "cifail: comment=true but GITHUB_TOKEN is not set — skipping PR comment." >&2
          elif [ -z "$pr" ]; then
            echo "cifail: comment=true but no pull request in this event — skipping PR comment." >&2
          else
            marker="<!-- cifail -->"
            comment_body="$(printf '%s\n## cifail\n\n%s\n\n<sub>%s</sub>\n' "$marker" "$body" "$provenance")"
            repo="$GITHUB_REPOSITORY"
            # Find our existing comment (by marker) and update it; otherwise create one.
            id="$(gh api "repos/$repo/issues/$pr/comments" --paginate \
              --jq "map(select(.body | startswith(\"$marker\"))) | .[0].id // empty" 2>/dev/null)"
            if [ -n "$id" ]; then
              gh api -X PATCH "repos/$repo/issues/comments/$id" -f body="$comment_body" >/dev/null \
                && echo "cifail: updated PR comment $id."
            else
              gh api -X POST "repos/$repo/issues/$pr/comments" -f body="$comment_body" >/dev/null \
                && echo "cifail: posted PR comment."
            fi
          fi
        fi

        rm -f "$report"

        # cifail exit codes: 0 ok, 1 negative result (no rule matched / gate found something
        # new), 2 usage error.
        if [ "$INPUT_FAIL" = "true" ]; then
          exit $code
        fi
        exit 0
