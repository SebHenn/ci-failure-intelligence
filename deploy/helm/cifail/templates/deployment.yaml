apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cifail.fullname" . }}
  labels:
    {{- include "cifail.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "cifail.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "cifail.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: cifail
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Runs `cifail serve` (the HTTP API, full/Docker build). See deploy/README.md.
          args:
            {{- toYaml .Values.serve.args | nindent 12 }}
            {{- if .Values.mtls.enabled }}
            - --client-ca
            - {{ printf "%s/%s" .Values.mtls.mountPath .Values.mtls.caKey | quote }}
            - --tls-cert
            - {{ printf "%s/%s" .Values.mtls.mountPath .Values.mtls.certKey | quote }}
            {{- if .Values.mtls.passwordSecretKey }}
            - --tls-password
            - "$(CIFAIL_TLS_PASSWORD)"
            {{- end }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.serve.port }}
          env:
            - name: CIFAIL_DB_PROVIDER
              value: {{ .Values.database.provider | quote }}
            - name: CIFAIL_DB_CONNECTION
              valueFrom:
                secretKeyRef:
                  name: {{ include "cifail.dbSecretName" . }}
                  key: {{ include "cifail.dbSecretKey" . }}
            {{- if .Values.auth.enabled }}
            - name: CIFAIL_SERVER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "cifail.authSecretName" . }}
                  key: {{ include "cifail.authSecretKey" . }}
            {{- end }}
            {{- if and .Values.mtls.enabled .Values.mtls.passwordSecretKey }}
            - name: CIFAIL_TLS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.mtls.existingSecret }}
                  key: {{ .Values.mtls.passwordSecretKey }}
            {{- end }}
          {{- if .Values.mtls.enabled }}
          volumeMounts:
            - name: tls
              mountPath: {{ .Values.mtls.mountPath }}
              readOnly: true
          {{- end }}
          # With mTLS the kubelet probes present no client cert, so HTTPS probes would fail the
          # handshake — use a TCP check instead (it only confirms the listener is up).
          livenessProbe:
            {{- if .Values.mtls.enabled }}
            tcpSocket:
              port: http
            {{- else }}
            httpGet:
              path: /healthz
              port: http
            {{- end }}
            initialDelaySeconds: 10
          # Readiness asks a different question from liveness: /readyz opens the store and
          # queries it, so a pod that cannot reach its database stops receiving traffic instead
          # of accepting requests it can only fail. Liveness deliberately stays on /healthz,
          # which never touches the store — restarting a healthy pod because the database
          # blinked turns a database problem into an outage.
          readinessProbe:
            {{- if .Values.mtls.enabled }}
            tcpSocket:
              port: http
            {{- else }}
            httpGet:
              path: /readyz
              port: http
            {{- end }}
            initialDelaySeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.mtls.enabled }}
      volumes:
        - name: tls
          secret:
            secretName: {{ required "mtls.existingSecret is required when mtls.enabled" .Values.mtls.existingSecret }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
