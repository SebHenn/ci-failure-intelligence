{{- /* Create a Secret only when a connection string is given inline AND no existing secret
       is referenced. For production, prefer database.existingSecret. */}}
{{- if and .Values.database.connectionString (not .Values.database.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cifail.dbSecretName" . }}
  labels:
    {{- include "cifail.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ include "cifail.dbSecretKey" . }}: {{ .Values.database.connectionString | quote }}
{{- end }}
{{- /* Same for the bearer token: create a Secret only when given inline and no existing
       secret is referenced. For production, prefer auth.existingSecret. */}}
{{- if and .Values.auth.enabled .Values.auth.token (not .Values.auth.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cifail.authSecretName" . }}
  labels:
    {{- include "cifail.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ include "cifail.authSecretKey" . }}: {{ .Values.auth.token | quote }}
{{- end }}
