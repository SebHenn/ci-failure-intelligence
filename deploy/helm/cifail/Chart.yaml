apiVersion: v2
name: cifail
description: |
  Shared cifail service. Runs the full cifail image as a long-running `cifail serve` HTTP
  API backed by an external database, protected by a shared bearer token (auth.* values).
  See deploy/README.md.
type: application
# Chart version; bump on chart changes.
version: 0.3.0
# The cifail version this chart targets (image tag default).
# Must match <Version> in Directory.Build.props — scripts/check-versions.sh enforces this.
appVersion: "0.2.0"
keywords:
  - ci
  - diagnostics
  - cifail
home: https://github.com/SebHenn/ci-failure-intelligence
sources:
  - https://github.com/SebHenn/ci-failure-intelligence
