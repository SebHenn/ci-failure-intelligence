# Default values for the cifail service chart (design spike — see deploy/README.md).

replicaCount: 1

image:
  repository: ghcr.io/sebhenn/cifail
  # Defaults to the chart's appVersion when empty.
  tag: ""
  pullPolicy: IfNotPresent

# The planned server entrypoint. `cifail serve` does not exist yet; this is what the chart
# will run once it does.
serve:
  port: 8080
  args:
    - serve
    - --port
    - "8080"

# Authentication (R9). When enabled, the server requires `Authorization: Bearer <token>` on
# every request except /healthz. Strongly recommended for any shared/exposed deployment —
# the endpoints both read and modify failure history.
auth:
  enabled: true
  # Option A (recommended): reference an existing secret holding the token.
  existingSecret: ""
  existingSecretKey: token
  # Option B (dev only): set the token here and let the chart create a Secret.
  token: ""

# Mutual TLS (R20, opt-in). When enabled, the server terminates HTTPS and requires every client
# to present a certificate that chains to the CA. Provide a Secret holding the CA bundle and the
# server PFX; the chart mounts it and passes --client-ca / --tls-cert. Because the kubelet probes
# present no client cert, the liveness/readiness probes switch to a TCP check while mTLS is on.
mtls:
  enabled: false
  # Secret with the CA bundle + server certificate keyed below. The server PFX password, if any,
  # is read from the env var named in `passwordEnvFromSecretKey` (optional).
  existingSecret: ""
  caKey: ca.pem
  certKey: server.pfx
  # Optional: key in the same Secret holding the PFX password (injected as CIFAIL_TLS_PASSWORD).
  passwordSecretKey: ""
  mountPath: /etc/cifail/tls

# External database the service persists to. cifail reads CIFAIL_DB_PROVIDER /
# CIFAIL_DB_CONNECTION (same as the CLI).
database:
  provider: postgres
  # Option A (recommended): reference an existing secret holding the connection string.
  existingSecret: ""
  existingSecretKey: connection-string
  # Option B (dev only): set the connection string here and let the chart create a Secret.
  connectionString: ""

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
    # - host: cifail.example.com
    #   paths:
    #     - path: /
    #       pathType: Prefix
  tls: []

resources: {}
  # limits:
  #   cpu: 500m
  #   memory: 256Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

podAnnotations: {}
